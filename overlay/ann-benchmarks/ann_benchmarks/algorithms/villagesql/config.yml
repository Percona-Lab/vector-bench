# Default (full-profile) VillageSQL sweep.
#
# scripts/render-configs.py overwrites this file in the working copy according to
# the selected profile, so editing it here only changes the standalone default.
#
# `M` and `efConstruction` are index options (`WITH (M = .., ef_construction =
# ..)`). efConstruction is pinned at 200, the value every other engine with the
# knob is built at; the extension refuses ef_construction < M and > 32 x M,
# and the module refuses such a build rather than clamp it under a label it was
# not built with, so M=6 (limit 192) is left out here as it is in m-sweep.
# The ef_search grid matches every other engine's; the scan searches at
# max(ef_search, k).
#
# The module checks the plan once per built index and refuses to time a full
# scan (see harness/drivers/villagesql.py); at the pinned build the plan is a
# distance scan on the index.
float:
  any:
  - base_args: ['@metric']
    constructor: VillageSQL
    disabled: false
    docker_tag: vector-bench/villagesql-bench
    module: ann_benchmarks.algorithms.villagesql
    name: villagesql
    run_groups:
      innodb:
        arg_groups: [{M: [8, 16, 24, 32], efConstruction: [200]}]
        args: {}
        query_args: [[10, 20, 40, 80, 120, 200, 400, 800]]
