# AliSQL engine definition.
#
# Vector support: VIDX (sql/vidx/vidx_hnsw.cc), shipped in AliSQL-8.0.44-2.
# Base is MySQL 8.0.44. AliSQL vendors all third-party code (including boost
# 1.77) inside the tree and has no git submodules, so its source export is a
# pure offline `git archive`.
name: alisql
display_name: AliSQL
family: mysql

source:
  tag: AliSQL-8.0.44-2
  upstream: https://github.com/alibaba/AliSQL.git
  submodules: ""

image:
  runtime: vector-bench/alisql-runtime
  bench: vector-bench/alisql-bench
  base: ubuntu:24.04

build:
  type: RelWithDebInfo
  march: x86-64-v3
  # Mirrors AliSQL's own build.sh release configuration, minus unit tests.
  #
  # DuckDB: do NOT try to switch it off. Two separate traps here, both found the
  # hard way:
  #
  #  1. `MYSQL_CHECK_DUCKDB()` is called unconditionally on Linux (CMakeLists.txt,
  #     inside `IF(LINUX)`), so the bundled DuckDB in extra/duckdb is compiled as
  #     an ExternalProject on every build no matter what. There is no flag that
  #     skips it.
  #  2. `-DWITH_DUCKDB_STORAGE_ENGINE=OFF` does not merely fail to save time — it
  #     produces a BROKEN BUILD. sql/CMakeLists.txt compiles sql/duckdb/*.cc into
  #     mysqld unconditionally, and those headers include
  #     storage/duckdb/delta_appender.h. Setting the flag OFF moves
  #     storage/duckdb/*.cc into a MODULE_ONLY plugin, so the final link of
  #     mysqld fails with `undefined reference to DeltaAppender::cleanup()`.
  #     The flag is therefore left at its default (ON), which is also what
  #     AliSQL's own build.sh uses.
  #
  # The DuckDB ExternalProject also runs `make ... > /dev/null 2>&1`, so the
  # build appears to stall for a long stretch with no output. That is expected.
  # Budget 1.5-3 hours for a cold AliSQL build and several GB of scratch space.
  cmake_flags:
    # NOT one of AliSQL's own release flags: it stops the TREE discarding the
    # CFLAGS the builder exports. Source `CMakeLists.txt:793` defaults
    # WITH_PACKAGE_FLAGS ON for a RELWITHDEBINFO standalone build on a DEB
    # platform -- `build.type` above -- and `cmake/compile_flags.cmake:131`
    # then OVERWRITES CMAKE_C_FLAGS with `dpkg-buildflags` output, so
    # `-march: x86-64-v3` above is silently dropped and nothing reports it
    # (`/opt/alisql/.march` is written from the build ARG). Both READ at the
    # pin.
    #
    # THE LEVEL, NOT THE TOKEN. The `-O3` TOKEN is dropped with everything
    # else, and docker/alisql/Dockerfile's delta lists it among the four lost
    # here. What is NOT affected is the optimisation the compiler applies: the
    # compile line ends with CMAKE_C_FLAGS_RELWITHDEBINFO's own
    # `-O2 -g -DNDEBUG` whether the overwrite happens or not, so the effective
    # level is 2 either way -- this tree says so itself at
    # `CMakeLists.txt:2709-2719` (READ). An earlier version of THIS comment
    # said `-march: x86-64-v3` "and `-O3`" were both silently dropped as
    # though the second changed the generated code; it does not, and that is
    # the half that was wrong.
    #
    # docker/alisql/Dockerfile carries the chain, the complete flag-by-flag
    # delta and the consequence for AliSQL's already-published numbers, and
    # tests/test_e8_package_flags_overwrite.py pins both copies.
    #
    # Duplicated with the Dockerfile's copy on purpose:
    # `scripts/build-images.sh:119` appends this list as ${CMAKE_FLAGS} AFTER
    # the Dockerfile's own flags, so a value here can only confirm, never
    # remove. `-DCMAKE_C_FLAGS=`, the other half of the fix, is deliberately
    # NOT here -- appended last it would win, carrying whatever literal this
    # file held instead of the `$CFLAGS` the builder actually exported.
    - -DWITH_PACKAGE_FLAGS=OFF
    - -DFORCE_INSOURCE_BUILD=ON
    - -DWITH_UNIT_TESTS=0
    - -DWITH_DEBUG=0
    - -DINSTALL_LAYOUT=STANDALONE
    - -DMYSQL_MAINTAINER_MODE=0
    - -DWITH_EMBEDDED_SERVER=0
    - -DWITH_EXTRA_CHARSETS=all
    - -DWITH_ZLIB=bundled
    - -DWITH_ZSTD=bundled
    - -DWITH_TIRPC=bundled
    - -DWITH_MYISAM_STORAGE_ENGINE=1
    - -DWITH_INNOBASE_STORAGE_ENGINE=1
    - -DWITH_CSV_STORAGE_ENGINE=1
    - -DWITH_PERFSCHEMA_STORAGE_ENGINE=0
    - -DWITH_EXAMPLE_STORAGE_ENGINE=0
    - -DWITH_TEMPTABLE_STORAGE_ENGINE=1
    - -DDEFAULT_CHARSET=utf8mb4
    - -DDEFAULT_COLLATION=utf8mb4_0900_ai_ci
    - -DWITH_BOOST=extra/boost/boost_1_77_0
    # Large MySQL components with no bearing on vector search.
    #
    # MySQL Cluster is the big one and takes TWO flags to actually switch off.
    # `-DWITH_NDB=OFF` alone is not enough: storage/ndb/CMakeLists.txt gates the
    # build on WITH_NDBCLUSTER_STORAGE_ENGINE, which the plugin system sets from
    # MYSQL_ADD_PLUGIN(ndbcluster ... DEFAULT STATIC_ONLY) regardless of
    # WITH_NDB — cmake still prints "Building ndbcluster plugin" and compiles
    # thousands of files. PLUGIN_NDBCLUSTER=NO is what the plugin system reads.
    - -DWITH_NDB=OFF
    - -DPLUGIN_NDBCLUSTER=NO
    - -DWITH_ROUTER=OFF
    - -DWITH_MYSQLX=OFF
    - -DWITH_AUTHENTICATION_LDAP=OFF
    - -DWITH_AUTHENTICATION_FIDO=OFF
    - -DWITH_AUTHENTICATION_CLIENT_PLUGINS=OFF
  # AliSQL's build.sh sets -D_GLIBCXX_USE_CXX11_ABI=0 on x86_64. We deliberately
  # do NOT, and leave this empty. DuckDB is built by its own Makefile as a
  # separate ExternalProject and sets its own flags, so forcing the old ABI on
  # mysqld while DuckDB uses the compiler default produced link errors of the
  # form `undefined reference to duckdb::InternalException::InternalException(
  # std::__cxx11::basic_string...)`. Letting every component use the toolchain
  # default keeps mysqld and libduckdb on one ABI, which is what actually links.
  extra_cxxflags: ""

# There is deliberately no `sql:` block. Every statement the ops harness sends
# is built in harness/drivers/mysql_family.py -- harness/ is mounted into the
# bench container on its own and cannot read config/, so nothing here could
# ever have been executed. The statements that do belong to this engine and are
# not in that file are `runtime.probe`'s below, and docker/alisql/init.sql's,
# which --init-file runs on every start.
#
# `SET GLOBAL vidx_disabled = OFF` is the one statement the removed block held
# that a server genuinely needs, and it has two live homes, neither of them
# here: ALISQL_DIALECT.global_setup in the driver, and init.sql -- which is
# where tests/verify-alisql-traps.sh says it comes from. The rest of the block
# had drifted unnoticed, because no reader existed: a CREATE TABLE with no
# `tag` column beside its own `tag` filter, and no mention of `ctag` once that
# column arrived. tests/test_c1_engine_sql.py fails if a block comes back.

server:
  common:
    # --no-defaults is NOT listed here. mariadbd/mysqld require it to be
    # the first argument; the entrypoint supplies it there, and a second
    # copy arriving later makes the server exit 2 at startup.
    # See mariadb.yml: --skip-grant-tables would implicitly disable networking
    # on MySQL 8. The bench account comes from --init-file instead.
    - --skip-name-resolve
    - --vidx-disabled=OFF
  normalized:
    - --innodb-buffer-pool-size={buffer_bytes}
    - --vidx-hnsw-cache-size={graph_cache_bytes}
    - --innodb-flush-log-at-trx-commit=2
    - --innodb-doublewrite=0
    - --transaction-isolation=READ-COMMITTED
  tuned:
    - --innodb-buffer-pool-size={buffer_bytes}
    - --vidx-hnsw-cache-size={graph_cache_bytes}
    - --innodb-flush-log-at-trx-commit=0
    - --innodb-doublewrite=0
    - --innodb-flush-method=O_DIRECT
    - --transaction-isolation=READ-COMMITTED
    - --skip-log-bin
  # Opt-in, ops path only: rendered after the pass's flags when a profile
  # sets `ops.server_wait_instruments: true` (`config.ops_wait_instruments`),
  # and recorded in `engines_resolved` and on every record when it is.
  # performance_schema is ON by default on this server and these three
  # families are OFF by default; with them off, the per-window wait profile
  # still has file IO, table IO and table-lock waits, but no latch can show
  # up in it. Turning them on puts a timer read on every latch acquisition,
  # so measure the overhead in a smoke run before publishing with it on.
  wait_instruments:
    - --performance-schema=ON
    - --performance-schema-instrument=wait/synch/mutex/%=ON
    - --performance-schema-instrument=wait/synch/rwlock/%=ON
    - --performance-schema-instrument=wait/synch/sxlock/%=ON

storage_engines:
  normalized: [InnoDB]
  tuned: [InnoDB]

capabilities:
  ef_construction_tunable: false
  m_per_index: true
  requires_read_committed: true
  filtered_search: true

# AliSQL's optimizer costs the vector index against a full scan and will choose
# a plain scan when the LIMIT is large relative to the row count — its own
# mysql-test/suite/rds/t/vidx_dml.test shows LIMIT 16 using the index and
# LIMIT 17 falling back to JT_ALL on a 100-row table. A silent fallback would
# measure brute force at 100% recall and make the comparison meaningless, so
# the driver verifies the plan and can force the index.
plan_guard:
  verify_index_used: true
  force_index_hint: "FORCE INDEX (vi)"

# Runtime facts the orchestrator needs to start and speak to this engine.
#
# These used to be six dictionaries keyed by engine name, spread across
# ann_pass, ops_pass, cli, charts and render. Adding an engine meant finding all
# six, and missing one produced a failure hours later rather than at load. They
# live here because everything else about an engine already does.
runtime:
  # Which harness driver drives it. A new *architecture* needs a new
  # driver in harness/drivers/; a new variant of this family does not.
  # Presentation and iteration order. Discovery is by directory, which is
  # alphabetical, and alphabetical is not the order this comparison is read
  # in -- the original three come first.
  order: 20
  driver: AliSQLDriver
  # Class name ann-benchmarks expects in the generated config.yml.
  ann_constructor: AliSQL
  port: 3306
  # Where the server keeps its data inside the image.
  data_mount: /var/lib/vbench
  server_data_mount: /server-data/data
  # Where mysqld's own diagnostics land INSIDE the container, i.e. what the
  # entrypoint gives --log-error. Must equal LOG_FILE's default in
  # docker/alisql/entrypoint-alisql.sh;
  # tests/test_e10_failures_explain_themselves.py reads both and fails if they
  # drift. A file in the data volume rather than a stream, so `docker logs`
  # carries only the entrypoint banner and teardown removes the rest with the
  # volume; ops_pass copies it out first.
  error_log: /var/lib/vbench/alisql.err
  credentials:
    user: "bench"
    password: "bench"
  # Opt-in engines are not in the original three-way comparison.
  group: original
  # Readiness probe, run inside the server container until it succeeds.
  probe:
    - "sh"
    - "-c"
    - "/opt/alisql/bin/mysql -ubench -pbench --socket=/var/run/vbench/alisql.sock -e 'SELECT 1' >/dev/null 2>&1"
  chart:
    color: "#d62728"
    marker: "s"
    linestyle: "--"
    label: "AliSQL (VIDX)"
  label: "AliSQL (VIDX)"
  # The index the ops pass builds. §4's secondary table ("at the build the
  # ops pass measured") is taken from it, and a headline floor figure from any
  # other build is marked, because the load, build, concurrency, filtered and
  # churn sections describe this index. `full-20260825` published Percona
  # Search's floor figures from the unquantized sweep beside ops figures from
  # the scalar index (which peaks at recall 0.892), and
  # pgvector's and Valkey's from efC=400 beside ops figures at 200 and the
  # server default. A value of `ops` is resolved per profile and
  # pass from what `orchestrator/ops_pass.py` passes the harness
  # (`orchestrator/reference_build.py`), and `cmd_run` refuses a build the ann grid
  # does not contain rather than reporting "—" for a whole engine afterwards.
  # Graph degree is VIDX's only build knob; the ops pass builds M=16.
  reference_build:
    m: 16
