# PostgreSQL + pgvector engine definition.
#
# The reference point outside the MySQL family. HNSW only, so the comparison
# stays an implementation comparison rather than an algorithm comparison.
name: pgvector
display_name: PostgreSQL + pgvector
family: postgres

source:
  tag: v0.8.6
  upstream: https://github.com/pgvector/pgvector.git
  submodules: ""

image:
  runtime: vector-bench/pgvector-runtime
  bench: vector-bench/pgvector-bench
  base: postgres:17-bookworm

build:
  # pgvector compiles its distance kernels with these; -march is applied on top.
  march: x86-64-v3
  optflags: "-O3 -fno-semantic-interposition"

# There is deliberately no `sql:` block. Every statement the ops harness sends
# is built in harness/drivers/postgres.py -- harness/ is mounted into the bench
# container on its own and cannot read config/, so nothing here could ever have
# been executed. The one statement that belongs to this engine and is not in
# that file is `runtime.probe`'s below.
#
# A block did sit here, drifting unnoticed because no reader existed: it
# declared a nullable `tag` where the driver creates `tag int NOT NULL`, and
# never mentioned `ctag` once that column arrived.
# tests/test_c1_engine_sql.py fails if a block comes back.

# Parallelism: four keys, two blocks, and deliberately not the same keys in
# both. `normalized` pins max_parallel_maintenance_workers=0 and
# max_parallel_workers_per_gather=0; `tuned` pins
# max_parallel_maintenance_workers, max_parallel_workers and
# max_worker_processes from {build_threads}. One key is in both; normalized
# has one of its own, tuned has two of its own, and each block leaves the
# other's at the PostgreSQL default.
#
# The question "is the normalized block missing two lines?" has been asked
# twice and never answered in writing -- docs/12-percona-feedback-plan.md
# §5.2 asks it and then prescribes "the same treatment" for Percona's
# innodb_parallel_read_threads off the back of it, so an unexamined asymmetry
# was about to be copied onto an eighth block. The answer belongs here.
#
# ANSWER: deliberate, and no key is missing. The blocks are asymmetric
# because switching parallelism OFF and switching it ON are not the same
# operation on a PostgreSQL server:
#
#   * Off takes one zero per path, at the innermost limit. A worker that is
#     never requested cannot be granted, so the pools above the request do
#     not matter.
#   * On takes every limit in the chain, because the weakest one decides. A
#     maintenance worker comes out of the pool max_worker_processes
#     establishes and is capped again by max_parallel_workers; pgvector
#     v0.8.6's README says so outright -- "For a large number of workers, you
#     may need to increase max_parallel_workers (8 by default)". Raise one of
#     the three and not the others and the build runs with fewer workers than
#     the manifest records, succeeds, and says nothing.
#
# A FOURTH LIMIT ON THE SAME COUNT, WHICH IS NOT A PARALLELISM KEY AT ALL:
# maintenance_work_mem, set two lines above each chain from
# {maintenance_bytes}. PostgreSQL 17's CREATE INDEX page states that it "may
# influence the number of worker processes requested, since parallel workers
# must have at least a 32MB share of the total maintenance_work_mem budget.
# There must also be a remaining 32MB share for the leader process." The
# granted count is therefore capped at floor(maintenance_work_mem / 32MB) - 1
# where that bites: eight workers need 288 MB, at 256 MB an eight-worker
# request is granted as seven, and smaller values cut harder. It reaches the
# HNSW build because ComputeParallelWorkers calls plan_create_index_workers,
# which is where the clamp lives, and the documented way out of it does not
# apply here -- that is a table-level `parallel_workers` reloption, and
# PostgresDriver's CREATE TABLE sets none.
#
# It does not bite at today's fractions, so this is a guard and not a live
# defect: both passes give maintenance_work_mem a tenth of the container
# limit, so eight workers are covered by any container above about 2.9 GB, and
# the normalized pass requests no workers to clamp.
#
# WHAT IS GUARDED, EXACTLY, because the guard is narrower than the hazard and
# an earlier draft of this paragraph claimed both halves. The tuned-chain test
# asserts that this value DERIVES from {maintenance_bytes}B, so a literal in
# place of the placeholder fails. That is a derivation check and not a
# magnitude check, and the magnitude is set somewhere this file cannot see:
# shrink maintenance_fraction in config/resources/tuned.yml and the value here
# is still {maintenance_bytes}B, the assertion still passes, and the clamp
# bites anyway -- at 0.01 a 16 GB container yields 160 MB, which grants four
# workers against a declared eight. THAT IS NOT CAUGHT HERE and the resource
# file is where it would have to be.
#
# A magnitude assertion is deliberately not added: 288 MB is not reachable on
# a small-RAM host -- a 4 GB box grants six workers against a build_threads of
# 8 -- so the test would fail legitimately there and re-introduce exactly the
# host-dependence that asserting the raw placeholder removed. A guard that is
# red on small machines is one somebody deletes.
#
# The key is also kept deliberately OUT of that test's parallelism family,
# because a memory knob with its own resource-fraction machinery is not a
# parallelism setting and a predicate that called it one would mis-describe it.
#
# THAT RULE IS A POSTGRESQL FACT AND DOES NOT PORT, which matters because
# this comment is the artefact whoever copies this shape will read.
# docs/12-percona-feedback-plan.md §5.2 proposes the same treatment for
# Percona's innodb_parallel_read_threads -- from {build_threads} in tuned
# and to 1 in normalized -- and the 1 there is right where the 0 here is
# right. MySQL documents that variable with a MINIMUM VALUE OF 1 and
# defines it as the number of THREADS used for a parallel clustered index
# read, not the number of workers beyond a leader. So its off position is
# 1, not 0, and "one zero per path" is a statement about these four GUCs
# rather than about parallelism budgets in general. Check the vendor's
# units and floor before reusing the rule.
#
# Hence three keys up and one key down, plus a fourth that exists only in
# normalized because there are two independent paths to close:
#
#   max_parallel_maintenance_workers -- the BUILD path, pinned in both. The
#     bulk build reads this and nothing else: ComputeParallelWorkers in the
#     pinned tree's src/hnswbuild.c returns max_parallel_maintenance_workers,
#     gated on plan_create_index_workers finding a parallel build safe and
#     capped by the table's parallel_workers reloption when one is set. The
#     0 in normalized is the load-bearing line of this block -- it is what
#     makes CREATE INDEX single-threaded and so comparable with MHNSW's and
#     VIDX's per-INSERT graph maintenance, which cannot be parallelised at
#     all. It holds parallel VACUUM to one process too, the same budget by a
#     second route. It is a literal 0 and not {build_threads} on purpose:
#     these GUCs count workers BEYOND the leader -- the README's example is
#     `SET max_parallel_maintenance_workers = 7; -- plus leader` -- so
#     {build_threads}, which normalized.yml sets to 1, would read as
#     "single-threaded" and buy a second process.
#   max_parallel_workers_per_gather -- the QUERY path, normalized only.
#     Zeroing the build says nothing about the query: a Gather node draws on
#     its own limit, and PostgreSQL 17 documents 0 here as "disables parallel
#     query execution". It is pinned because of the full-table-scan fallback
#     CLAUDE.md warns about -- a filtered query that misses the HNSW index
#     degrades to an exact scan, and the README names this exact key as the
#     way to make that scan fast ("To speed up queries without an index,
#     increase max_parallel_workers_per_gather"). At its default of 2 the
#     normalized pass would hand pgvector two extra cores on precisely the
#     queries where it had lost its index, against MySQL-family engines with
#     no equivalent.
#   max_parallel_workers and max_worker_processes -- the two POOLS, tuned
#     only, and absent from normalized by decision rather than by omission.
#     They are ceilings on requests for parallel workers, and in the
#     normalized pass this workload makes no such request: the build asks for
#     zero and Gather is disabled, while autovacuum draws on
#     autovacuum_max_workers and not on this pool. What sits in the pool is
#     spare slots that nothing in the measurement can reach.
#
# AND THE ASYMMETRY RUNS THE OTHER WAY TOO, which is the half the plan did
# not notice: max_parallel_workers_per_gather is absent from TUNED, so a
# tuned pgvector query gets PostgreSQL's default of 2 workers per Gather and
# not {build_threads}. Per-gather width does not follow from
# max_parallel_workers -- that is a pool, this is the per-node cap. So the
# tuned pass gives pgvector a build_threads-wide build and a vendor-default
# query. That is defensible, because the tuned pass is each vendor's own
# recommendation and the vendor ties this key to the no-index path that every
# configuration is checked against through explain_uses_vector_index(); it is
# recorded here rather than changed, for the reason below.
#
# WHY NOT MAKE ALL FOUR SYMMETRIC AND BE DONE: because the settings an engine
# runs under are part of what its numbers mean. max_parallel_workers=0 or
# max_worker_processes=0 in normalized, or
# max_parallel_workers_per_gather={build_threads} in tuned, is the same
# workload against a different amount of machine. That is an application of
# the precedent OPS_MEASUREMENT_VERSION 3 set rather than the thing it was
# bumped for -- 3 was the concurrency query pool, "two different amounts of
# the corpus" -- and version 6 is where the precedent is stated in the form
# this borrows: "the same workload against a different amount of load is not
# two samples of one quantity" (harness/metrics/records.py). So it would owe
# a bump that invalidates comparison across every ops phase of
# every engine, to settle a fairness question nobody has raised about a
# published number. This change moved no key, so every pgvector figure in the
# archive still means what it meant.
#
# NONE OF THIS HAS BEEN VERIFIED AGAINST A RUNNING SERVER. It is read off the
# pinned pgvector tree (v0.8.6) and PostgreSQL 17's documentation for these
# four GUCs. What is tested is what this repository SENDS:
# tests/test_config.py::TestEveryPgvectorParallelismKnobIsPinnedOnPurpose
# asserts each pass's key set and values rather than the presence of a
# string, so moving a key between the blocks fails against this comment. Both
# blocks are also asserted CLOSED over any setting whose name mentions a
# worker or parallelism: the four above are the whole of it, and pinning a
# fifth -- autovacuum_max_workers, max_logical_replication_workers, anything
# like them -- fails that test whatever its value, so it costs an edit there
# and a reviewer who reads the reason. Note that naming one in this comment is
# NOT that argument: autovacuum_max_workers appears above, in the sentence
# about which pool autovacuum draws on, and a substring check mistook that for
# an explanation.
#
# THAT GUARD READS WHAT THE SERVER READS, in every spelling postgres accepts:
# `-c name=value` as below, `-cname=value`, and a bare `--name=value` with
# hyphens folded to underscores the way the server's own ParseLongOption folds
# them. It has to, for two reasons that compound. This file is the only engine
# config using `-c` pairs -- percona.yml, mariadb.yml, mariadb123.yml and
# alisql.yml spell their whole server blocks `--name=value` -- so a bare long
# option is the house habit, not an exotic edit. And
# docker/pgvector/entrypoint-pgvector.sh appends ${VB_SERVER_ARGS} UNQUOTED
# into the argv it execs, so such a token word-splits and reaches postgres
# intact. A guard that recognised only the `-c` form would have let
# `--max-parallel-workers=16` through while claiming to be closed, and a later
# duplicate wins at the server exactly as it wins in the test's dict.
server:
  common:
    - -c
    - "fsync=off"
    - -c
    - "full_page_writes=off"
  normalized:
    - -c
    - "shared_buffers={buffer_bytes}B"
    - -c
    - "maintenance_work_mem={maintenance_bytes}B"
    # Two zeros, one per path: the build and the Gather node have
    # separate limits. Read the parallelism note above before moving
    # either, or adding a third key here at anything but 0.
    - -c
    - "max_parallel_maintenance_workers=0"
    - -c
    - "max_parallel_workers_per_gather=0"
    - -c
    - "synchronous_commit=off"
  tuned:
    - -c
    - "shared_buffers={buffer_bytes}B"
    - -c
    - "maintenance_work_mem={maintenance_bytes}B"
    # Three limits, one effect: a maintenance worker has to clear all
    # three, and the weakest decides. They move together or not at all.
    - -c
    - "max_parallel_maintenance_workers={build_threads}"
    - -c
    - "max_parallel_workers={build_threads}"
    - -c
    - "max_worker_processes={build_threads}"
    - -c
    - "synchronous_commit=off"
    - -c
    - "wal_level=minimal"
    - -c
    - "max_wal_senders=0"
    - -c
    - "checkpoint_timeout=30min"
    - -c
    - "max_wal_size=16GB"

storage_engines:
  normalized: [heap]
  tuned: [heap]

capabilities:
  # The one asymmetry that matters most: only pgvector lets you tune build
  # quality. It is therefore pinned to its default in the normalized pass so it
  # is not handed a tuning axis MariaDB and AliSQL do not have.
  ef_construction_tunable: true
  ef_construction_normalized: 200
  m_per_index: true
  requires_read_committed: false
  filtered_search: true
  # pgvector 0.8 added iterative index scans, which materially change filtered
  # search behaviour. Recorded so the report can say which mode produced a number.
  iterative_scan_modes: [off, relaxed_order, strict_order]
  # Postgres has no cumulative wait-event counters, so its per-window wait
  # profile can only come from sampling pg_stat_activity DURING the window --
  # an extra backend no other engine's window carries. Opt-in through
  # `ops.server_wait_sampler`; this is the interval the driver samples at
  # (`PostgresDriver.wait_sample_interval_s`, pinned against it by
  # `tests/test_e27_server_wait_evidence.py`), recorded in `engines_resolved`
  # when the sampler is on.
  wait_sampler_interval_s: 1.0

# Runtime facts the orchestrator needs to start and speak to this engine.
#
# These used to be six dictionaries keyed by engine name, spread across
# ann_pass, ops_pass, cli, charts and render. Adding an engine meant finding all
# six, and missing one produced a failure hours later rather than at load. They
# live here because everything else about an engine already does.
runtime:
  # Which harness driver drives it. A new *architecture* needs a new
  # driver in harness/drivers/; a new variant of this family does not.
  # Presentation and iteration order. Discovery is by directory, which is
  # alphabetical, and alphabetical is not the order this comparison is read
  # in -- the original three come first.
  order: 30
  driver: PostgresDriver
  # Class name ann-benchmarks expects in the generated config.yml.
  ann_constructor: PGVector
  port: 5432
  # Where the server keeps its data inside the image.
  data_mount: /var/lib/postgresql
  # No read-only sizing mount: the index is not a separate on-disk artifact.
  server_data_mount: null
  credentials:
    user: "postgres"
    password: ""
  # Opt-in engines are not in the original three-way comparison.
  group: original
  # Readiness probe, run inside the server container until it succeeds.
  probe:
    - "sh"
    - "-c"
    - "psql -U postgres -d ann -tAc 'SELECT 1' >/dev/null 2>&1"
  chart:
    color: "#2ca02c"
    marker: "^"
    linestyle: "-."
    label: "PostgreSQL (pgvector)"
  label: "PostgreSQL (pgvector)"
  # The index the ops pass builds. §4's secondary table ("at the build the
  # ops pass measured") is taken from it, and a headline floor figure from any
  # other build is marked, because the load, build, concurrency, filtered and
  # churn sections describe this index. `full-20260825` published Percona
  # Search's floor figures from the unquantized sweep beside ops figures from
  # the scalar index (which peaks at recall 0.892), and
  # pgvector's and Valkey's from efC=400 beside ops figures at 200 and the
  # server default. A value of `ops` is resolved per profile and
  # pass from what `orchestrator/ops_pass.py` passes the harness
  # (`orchestrator/reference_build.py`), and `cmd_run` refuses a build the ann grid
  # does not contain rather than reporting "—" for a whole engine afterwards.
  # `harness_args` passes `--ef-construction` from `ann.pgvector_ef_construction`
  # (default 200) in BOTH passes, while the tuned grid sweeps 64/200/400 -- so
  # `ops` and not a literal: a profile that pins another value builds that.
  reference_build:
    m: 16
    ef_construction: ops
