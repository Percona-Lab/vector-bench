# Percona Server engine definition.
#
# Vector support: InnoDB HNSW (storage/innobase, `VECTOR KEY … TYPE hnsw`),
# in Percona Server's `9.7` series over MySQL 9.7.2 LTS. The vector work used
# to live on branch `vector-mvp`; it was merged into `9.7` on 2026-10-26 and
# the pin below is a commit in that series, not on that branch. Everything
# here is pinned to one commit and the whole design is written up in
# docs/09-adding-percona-server.md, which cites the server's own sources and
# recorded MTR output for every claim.
#
# NOTHING IN THIS FILE HAS EVER BEEN RUN. The image has never been built and no
# server has been started from it. The first thing that will exercise it is the
# smoke run, and docs/09 §5 lists what that run has to survive.
name: percona
display_name: Percona Server
family: mysql

source:
  # The key is `tag` even though the value is a SHA, and that is not a cosmetic
  # choice. `orchestrator/engines.py:_source_tag` is
  # `return str(source.get("tag") or source.get("version") or "")` -- there is
  # no `sha` key, so a `source: sha:` block would make `_source_tag()` return
  # the empty string. `scripts/prepare-sources.sh:prepare_percona` then DIES:
  # it reads this key with `""` as the default and `die`s on an empty value.
  # It does NOT fall back to a hard-coded default: the three other
  # `prepare_*` functions that read this key pass a hard-coded tag as the
  # default (`AliSQL-8.0.44-2`, `mariadb-11.8.8`, `v0.8.6`) and this one
  # passes `""`. An earlier revision of this comment said the opposite. `orchestrator/ops_pass.py`
  # reads the same key into `VB_ENGINE_TAG`, which is what reaches the
  # manifest, so a misnamed key would also publish a run whose engine version
  # is blank. `git archive` takes a SHA wherever it takes a tag, so the
  # mechanism is unchanged. (That first citation was a line range for most of
  # this file's life and had rotted by 21 lines by the time anyone read it; it
  # is a symbol now, which is what CLAUDE.md asks of a new citation.)
  #
  # THE VALUE IS A COMMIT AND MUST NEVER BE A BRANCH NAME, which matters more
  # in this series than it did on `vector-mvp`. `git archive` would accept
  # `9.7` and resolve it afresh on every build, so two runs carrying the same
  # manifest would not be the same server. `9.7` moved while this re-pin was
  # being written: it was at 56124b03 on 2026-10-26T12:41:43Z and at f52fe4b0
  # by 2026-10-27T10:54:59Z, four commits later.
  # `tests/test_e2_percona_wiring.py` asserts the SHAPE of this value
  # separately from its content, because asserting only that it equals the
  # test's own constant would pass with a branch name in both places.
  #
  # Compare SHAs and never dates. The series was rebased onto `9.7` at merge,
  # so this commit's author date (2026-10-14T22:27:46Z) sits eleven days under
  # its committer date (2026-10-26T12:41:43Z) and its parent carries the same
  # committer second -- which is the fingerprint of a rebase and the reason a
  # date is not an identifier here.
  #
  # WHAT THIS PIN IS, read from the vendor's API rather than inferred from a
  # commit subject. The vector search MVP was merged out of `vector-mvp` into
  # the `9.7` series as PR #6278 (`vector-mvp-97-squashed` -> base `9.7`, 30
  # commits, 331 files, +37,587/-322, merged 2026-10-26T12:41:44Z). The merge
  # was a REBASE and not a squash: GitHub reports this SHA as that PR's
  # `merge_commit_sha`, and for a rebase merge that field is the LAST of the
  # rebased commits -- here PS-11751, a VIRTUAL-generated-column fix read
  # through an HNSW vector index, 8 files and +586/-21 on its own. Pinning it
  # therefore takes the whole series, and the PR's aggregate figures above
  # describe the PR and not this commit's diff. Calling it "the squash commit"
  # would invite the next reader to look for a 331-file diff here, not find
  # one, and conclude the pin was wrong.
  #
  # The previous pin -- the `vector-mvp` tip of 2026-10-13, which
  # docs/12-percona-feedback-plan.md names and this file deliberately no
  # longer does -- is NOT an ancestor of this one: GitHub's compare of the two
  # reports `diverged`: measured FROM the old pin, this one is 721 commits
  # ahead of it and the old pin holds 43 that this one does not. Nothing
  # from that branch tip is reachable from here, which is why this is a re-pin
  # and not a fast-forward, and why the cmake flags below are unverified at
  # this base until a configure has run.
  #
  # MOVING THIS KEY DOES NOT INVALIDATE THE RECALL RESULTS, AND IT SHOULD.
  # `orchestrator/ann_pass.py:ann_fingerprint` is deliberately
  # engine-invariant and holds no source tag, so a new pin leaves
  # `results/annb/<pass>/<fingerprint>/` exactly where it was.
  # ann-benchmarks then skips every configuration whose result file is already
  # on disk and reports that as success, so the old binary's recall cells are
  # reused under the new pin's `engine_version`, and the only thing that says
  # so first is `ann_pass.run_engine`, which prints `[ann] N existing result
  # file(s) ... will be skipped` BEFORE the run -- its comment's first five
  # words are "Warn before the fact, not after" -- while
  # `report/generate.py`'s `stale_ann` bucket adds the per-cell attribution in
  # the Validity section afterwards. So, before the first run at a new pin,
  # MOVE THIS ENGINE'S SUBTREE OF THE ANN RESULTS TREE ASIDE:
  # `results/annb/<pass>/<fingerprint>/<dataset>/<k>/percona/`.
  # `_count_results` counts `.hdf5` files under directories named for the
  # engine, so moving them makes it return 0 and ann-benchmarks measures the
  # curve again.
  #
  # A FRESH RUN DIRECTORY DOES NOT DO IT, and that is the trap. `paths` in
  # `orchestrator/cli.py` puts `ops_results` at the run directory but
  # `annb_results` at `results/annb`, a SIBLING of it -- CLAUDE.md's invariant
  # says the tree is shared across runs on purpose. So a new `--run-id` gives
  # a clean ops tree and leaves every recall cell exactly where it was. It is
  # a separate requirement, for the ops path, and it is below.
  #
  # DO NOT REACH FOR `--force` INSTEAD, even though its help text offers
  # precisely this ("re-run ann-benchmarks points that already have results").
  # The same flag is the escape hatch on the free-disk refusal --
  # `_check_free_disk(...) and not args.force` in `orchestrator/cli.py` -- so
  # passing it silently disables the one refusal a core-dump campaign most
  # needs. A Percona core is about its peak RSS, tens of GiB, and the recorded
  # reason for that guard is that a pgvector phase once died two seconds in
  # because the volume had nowhere to put the cluster and nothing in the run
  # said so. Moving the subtree aside buys the re-measurement without buying
  # that.
  #
  # Bumping `ANN_MEASUREMENT_VERSION` is NOT the remedy either: it would move
  # every pass's tree and re-measure every recall point for all seven engines
  # and both resource passes.
  #
  # AND THE OPS PATH HAS THE SAME HAZARD WITH NO `--force` FOR IT: the
  # report's provenance table (`report/render.py:_engine_rows`) prints
  # `source.tag` and `source.commit[:12]` from the manifest, ONE value per
  # engine per run directory, and `manifest.py:set_engine` overwrites that
  # entry from `sources/percona.source.json` at build time without comparing
  # it. So the first run after a rebuild goes to a FRESH run directory: run it
  # with NEITHER `--resume` NOR `--run-id`, which is what makes the
  # orchestrator start one, and never resume a directory that already holds
  # pre-rebuild Percona ops records -- otherwise two servers' numbers pool
  # into one `build_signature` under the new commit and the report attributes
  # all of them to the new one. A smoke result from a stale directory would
  # stand in for the run that validates this re-pin.
  tag: 56124b03fdc5954e2401ab4d2c7bf7cb3a767158   # tip of PR #6278 on base 9.7
  upstream: https://github.com/percona/percona-server.git
  # No `submodules:` key, deliberately: all four of the pin's submodules are
  # switched off in the build instead, which takes four cmake flags, one of
  # them non-obvious. Listing them here the way mariadb.yml lists libmariadb
  # would make the build fetch from three more hosts. See docker/percona/
  # Dockerfile note 2, which names each submodule beside the flag that handles
  # it and records which flag spellings were measured to work.

image:
  runtime: vector-bench/percona-runtime
  bench: vector-bench/percona-bench
  base: ubuntu:24.04

build:
  type: RelWithDebInfo
  # MUST equal the march of every other engine BUILT FROM SOURCE -- mariadb,
  # mariadb123, alisql and pgvector, all x86-64-v3. (mongodb and valkey are
  # installed from packages and declare `march: none`; there is nothing of
  # ours compiled in them to mismatch.) Those five compile SIMD distance
  # kernels, and a different flag on one turns the benchmark into a comparison
  # of compiler flags -- see CLAUDE.md's "Never mix -march between engines". The
  # value is written to /opt/percona/.march in the image so both `march`
  # readers can report which one was actually used (docs/09 §4.8).
  march: x86-64-v3
  # The flags that switch off the four submodules a `git archive` cannot ship,
  # plus the large MySQL components with no bearing on vector search. They are
  # also spelled out in docker/percona/Dockerfile's cmake invocation, which is
  # the copy the build actually depends on: `scripts/build-images.sh` appends
  # these as ${CMAKE_FLAGS} *after* the Dockerfile's own, so a value here can
  # only confirm or override, never remove. Both copies carry the same values,
  # and docker/percona/Dockerfile note 2 is where the reasoning lives.
  #
  # WITHOUT_COMPONENT_KEYRING_KMIP=1 is the non-obvious one, and it is a value
  # spelling rather than a flag choice: the component's gate is
  # `IF(NOT DEFINED WITH_… AND NOT DEFINED WITHOUT_… OR WITH_…)`, so defining
  # the WITHOUT_ symbol is what closes it. Measured, not reasoned -- the
  # Dockerfile note records which spellings were tried.
  #
  # EVERY MEASUREMENT BELOW WAS MADE AGAINST THE 9.7.1 BASE AT THE PREVIOUS
  # PIN. This engine is pinned about four months further on and no configure
  # has been run against the new base, so the list is carried forward
  # unchanged and unverified. Re-verifying it needs a configure, a configure
  # is a build, and that build is the gate this re-pin must not be merged
  # ahead of.
  #
  # WITH_CURL=bundled was not chosen, it was measured -- by five failed
  # configures of this tree on 2026-10-14, the first time anyone built it.
  # The attempt before it took the remediation the error itself prints
  # ("You can disable CURL with -DWITH_CURL=0", CMakeLists.txt:2127) and
  # configure then died somewhere else entirely:
  #
  #     CMake Error at components/keyrings/keyring_vault/CMakeLists.txt:33
  #       Not building Keyring Vault Component, could not find CURL library
  #
  # Percona's Keyring Vault component fails hard when the curl target is
  # missing instead of skipping itself, so switching curl off is not on offer
  # here. `bundled` is the value Percona's own build uses --
  # build-ps/build-binary.sh's CMAKE_COMMON_FLAGS carries `-DWITH_CURL=bundled`
  # beside -DWITH_ZLIB=bundled, -DWITH_LIBEVENT=bundled and -DWITH_ZSTD=bundled
  # -- and the source tree ships its own copy, so it needs no system libcurl.
  #
  # The lesson that cost those five rounds, written down because it will come
  # back for the eighth engine: on this tree, switching a dependency OFF breaks
  # a Percona component that wanted the target, while installing the dependency
  # does not. It was learned twice -- first with LDAP, where three
  # -DWITH_AUTHENTICATION_*=OFF flags cleared CMakeLists.txt:2075 and then hit
  # plugin/auth_ldap, a Percona plugin with its own unconditional check that no
  # upstream flag governs. The fix for all of them is the builder stage's apt
  # list in docker/percona/Dockerfile, not a flag.
  cmake_flags:
    # NOT a vector-search option, and the only entry in this list that exists
    # to stop the TREE discarding our flags rather than to switch a component
    # off. Percona's source `CMakeLists.txt:758` defaults WITH_PACKAGE_FLAGS ON
    # for a RELWITHDEBINFO standalone build on a DEB platform -- which is
    # exactly `build.type` above -- and `cmake/compile_flags.cmake:130` then
    # OVERWRITES CMAKE_C_FLAGS with `dpkg-buildflags` output, taking `-march`
    # with it. Both READ at the pin.
    #
    # THE LEVEL, NOT THE TOKEN. The `-O3` TOKEN is lost with everything else,
    # and docker/percona/Dockerfile's delta table lists it under LOST. What is
    # NOT affected is the optimisation the compiler actually applies: the
    # compile line ends with CMAKE_C_FLAGS_RELWITHDEBINFO's own
    # `-O2 -g -DNDEBUG` whether the overwrite happens or not, so the effective
    # level is 2 either way. `CMakeLists.txt:2959-2969` is where the pin says
    # so (READ). An earlier version of THIS comment said the overwrite takes
    # "`-march` and `-O3` with it" as though the second mattered to the
    # generated code; it does not, and that is the half that was wrong.
    #
    # The full chain, with its measurements and the complete flag-by-flag
    # delta, is written out in docker/percona/Dockerfile above that file's own
    # copy of this flag, and tests/test_e8_package_flags_overwrite.py pins
    # both copies.
    #
    # This IS the deliberate duplicate the note above describes, not drift:
    # `scripts/build-images.sh:119` appends this list as ${CMAKE_FLAGS} AFTER
    # the Dockerfile's own flags, so a value here can only confirm or override
    # one of them, never remove it.
    #
    # `-DCMAKE_C_FLAGS=`, the other half of the fix, is deliberately NOT here
    # and must not be added. Being appended LAST it would WIN, and the value it
    # would carry is whatever literal this file happened to hold -- not the
    # `$CFLAGS` the builder stage exported two lines above its cmake call,
    # which is what the Dockerfile's copy passes on.
    - -DWITH_PACKAGE_FLAGS=OFF
    - -DWITH_COREDUMPER=OFF
    - -DWITH_AUTH_OPENID_CONNECT=OFF
    - -DWITH_CURL=bundled
    - -DWITH_ROCKSDB=OFF
    - -DWITHOUT_COMPONENT_KEYRING_KMIP=1
    - -DWITH_NDB=OFF
    - -DWITH_ROUTER=OFF
    - -DWITH_MYSQLX=OFF
    - -DWITH_UNIT_TESTS=OFF
    - -DWITH_SSL=system
    - -DWITH_ZLIB=bundled
    - -DWITH_ZSTD=bundled
  extra_cxxflags: ""

# There is deliberately no `sql:` block, and this file is the first engine
# config written after the blocks were removed rather than one they were
# removed from. Every statement the ops harness sends is built in
# harness/drivers/mysql_family.py -- harness/ is mounted into the bench
# container on its own and cannot read config/, so nothing here could ever be
# executed. The statements that do belong to this engine and are not in that
# file are `runtime.probe`'s below and docker/percona/init.sql's, which
# --init-file runs on every start.
#
# The removed blocks had drifted precisely because no reader existed:
# `index_plan_marker: "v"` against a driver that names the index `vi`, a
# `create_table` with no `tag` column beside its own `tag` filter, and no
# mention of `ctag`. tests/test_c1_engine_sql.py fails if a block comes back.

# Server knobs, per fairness pass. {buffer_bytes} etc. are filled in by the
# orchestrator from the resource pass.
server:
  common:
    # --no-defaults is NOT listed here. mysqld requires it to be the first
    # argument; the entrypoint supplies it there, and a second copy arriving
    # later makes the server exit 2 at startup.
    - --skip-name-resolve
    # THE TWO FLAGS BELOW HAVE NEVER BEEN ACCEPTED BY A RUNNING SERVER, and
    # nothing in the test suite can change that. An unknown server variable
    # makes mysqld exit at startup, so the only thing that establishes these
    # two spellings exist on this base is the rebuild on the build host
    # followed by `./run-benchmark.sh run --profile dev`. Until that run
    # starts a server and the log shows the `exec mysqld` line carrying both,
    # treat them as proposed. If `dev` fails at startup, the failure will look
    # like "the image is broken" and it will be one of these.
    #
    # WHY ASK FOR A CORE AT ALL. In run full-20261015-215006 half the percona
    # ops units wrote no record at all: each died inside its first INSERT
    # with `Lost connection to server during query` in 0.5-5.5 s. The count,
    # and the resume that moved it, are in `runtime.error_log`'s comment
    # below and are deliberately not restated here -- two copies of one
    # figure is how the figure drifts. A core is the one artefact that
    # distinguishes which of several faults that was, and it needs three
    # separate things to be true -- this flag,
    # `runtime.ulimits.core` below, and a host `kernel.core_pattern` that
    # writes a file rather than piping to apport. The orchestrator prints the
    # third at server start and must not change it.
    - --core-file
    # THE SECOND FLAG IS THE DIFFERENCE BETWEEN AN ARTEFACT AND A DISK
    # INCIDENT, and it is the one a reader will be tempted to delete.
    # `innodb_buffer_pool_in_core_file` defaults ON, which means the core
    # contains the whole buffer pool. config/resources/tuned.yml sets
    # `buffer_fraction: 0.35`, and the tuned pass on the reference machine
    # gives this engine a 112.5 GiB container cap (the figure
    # orchestrator/manifest.py quotes), so the buffer pool alone is
    # 0.35 x 112.5 = 39.4 GiB of core -- written into the data volume under
    # state/, on the filesystem the checkout is on, and then copied into
    # results/ before teardown. With it OFF the core is bounded by the rest of
    # the resident set, which across that run's ops phases peaked at
    # 48.5 GiB (54.7 GiB counting its ann phases, which this does not serve).
    #
    # Nothing is lost by switching it off: the buffer pool is a cache of pages
    # that are also on disk, and the question a core answers here is which
    # stack frame the server died in.
    - --innodb-buffer-pool-in-core-file=OFF
  normalized:
    - --innodb-buffer-pool-size={buffer_bytes}
    # UNLIMITED, AND NOT {graph_cache_bytes}. This is a decided policy and the
    # full argument is docs/09 §3; the short version is that
    # innodb_hnsw_max_memory is not the same KIND of limit as MariaDB's
    # mhnsw_max_cache_size or AliSQL's vidx_hnsw_cache_size. Those two are
    # caches: a graph larger than the cache still works, read back from the
    # companion table, and performance degrades. Percona's is a hard
    # allocation ceiling with no per-node eviction -- exceeding it FAILS THE
    # STATEMENT with ER_CAPACITY_EXCEEDED, and not only during ingest: the
    # limit is re-checked as a cold search faults nodes in, so a post-restart
    # query phase can die after the expensive part is already paid for.
    #
    # Feeding it {graph_cache_bytes} would therefore compare a cache budget
    # against a wall: at normalized.yml's graph_cache_fraction the three
    # engines would get the same byte count and one of them could not finish
    # the load at M=32 on glove-100, where the floor alone exceeds 1 GiB. A
    # benchmark in which one engine errors and two degrade is reporting on a
    # difference in limit semantics, not on index quality.
    #
    # At 0 the graph is bounded only by the container's memory limit, which
    # the orchestrator already sets and already records -- so Percona is held
    # to the same TOTAL budget as every other engine, measured where the
    # others' budgets are measured.
    #
    # The audit trail for that is `Innodb_hnsw_memory_used` -- and it is
    # THINNER THAN THIS COMMENT USED TO CLAIM. It is collected onto the
    # `index_build` record and no other: `ingest`, `concurrency`, `filtered`,
    # `churn` and `ef_calibration` carry no reading, so the trail covers one
    # of the six ops phases. An audit trail for a fairness decision that
    # covers a sixth of the run, described as per-phase, is the shape of
    # defect CLAUDE.md opens by warning about, which is why it is spelled out
    # here rather than rounded up. Widening it is unlanded work.
    #
    # EVERY FIGURE TAKEN FROM IT MUST ALSO CARRY THE CAVEAT that it
    # omits the node map (HNSW::m_nodes, roughly 30-50 bytes per node on the
    # normal heap) and search scratch space. At glove-100's 1,183,514 rows
    # that is 35.5-59.2 MB unreported per vector index. It is a FLOOR on graph
    # memory, not a measurement of it.
    - --innodb-hnsw-max-memory=0
    - --innodb-flush-log-at-trx-commit=2
    - --innodb-doublewrite=0
  tuned:
    - --innodb-buffer-pool-size={buffer_bytes}
    # Same policy, same reasoning, in both passes: the asymmetry against the
    # other two MySQL-family engines is structural and is reported rather than
    # tuned away.
    - --innodb-hnsw-max-memory=0
    - --innodb-flush-log-at-trx-commit=0
    - --innodb-doublewrite=0
    - --innodb-flush-method=O_DIRECT
    - --skip-log-bin
  # Opt-in, ops path only: rendered after the pass's flags when a profile
  # sets `ops.server_wait_instruments: true` (`config.ops_wait_instruments`),
  # and recorded in `engines_resolved` and on every record when it is.
  # performance_schema is ON by default on this server and these three
  # families are OFF by default; with them off, the per-window wait profile
  # still has file IO, table IO and table-lock waits, but no latch can show
  # up in it. Turning them on puts a timer read on every latch acquisition,
  # so measure the overhead in a smoke run before publishing with it on.
  wait_instruments:
    - --performance-schema=ON
    - --performance-schema-instrument=wait/synch/mutex/%=ON
    - --performance-schema-instrument=wait/synch/rwlock/%=ON
    - --performance-schema-instrument=wait/synch/sxlock/%=ON

# InnoDB only, and by the server's construction rather than by our choice: the
# vector index is InnoDB's. A profile asking for anything else gets a server
# error naming the engine instead of silently getting InnoDB.
storage_engines:
  normalized: [InnoDB]
  tuned: [InnoDB]

capabilities:
  # The one capability that separates Percona from the rest of the MySQL
  # family here: it has BOTH a build-time (`ef_construction`) and a query-time
  # (`innodb_hnsw_ef_search`) effort knob. CLAUDE.md's "Structural
  # asymmetries" bullet says ef_construction "is exposed only by pgvector and
  # Valkey", which this engine makes false -- see the report notes in docs/09.
  ef_construction_tunable: true
  m_per_index: true
  # Unlike alisql, whose VIDX raises ER_NOT_SUPPORTED_YET on every vector
  # operation outside READ COMMITTED. No test in the pinned tree's
  # percona_vector suite sets an isolation level to make vector DML work.
  requires_read_committed: false
  filtered_search: true
  # TRUE AT THIS PIN; IT WAS FALSE AT THE OLD ONE, AND ONLY HALF OF WHAT THE
  # FALSE WITHDREW COMES BACK WITH IT.
  #
  # WHAT THE KEY DRIVES. `ALTER TABLE t1 ADD VECTOR KEY vi (...)
  # ALGORITHM=INPLACE` on a table loaded with NO vector index -- the statement
  # `PerconaDriver.create_index` issues for `build_mode: post` -- read through
  # the single reader `orchestrator/cli.py:_bulk_vector_index_build`. The ops
  # loop picks the DEFAULT build mode from it (true -> `post`, false ->
  # `incremental`); an explicit mode in a profile is honoured either way, with
  # a warning when the key is false. It does NOT drive the ann phase: the ann
  # overlay module declares the index in CREATE TABLE, i.e. builds
  # incrementally, and has no `build_mode` at all.
  #
  # THE OLD PIN (9.7.1-1, built -march=native), 2026-10-15. On
  # fashion-mnist-784-euclidean, 20,000-row subset, M=16, ef_construction=200,
  # normalized pass, the same profile on the same image: run
  # `percona-20261015-183321` built the index in 7.6 s, and run
  # `percona-20261015-203911` loaded in 7.7 s at 2,583 rows/s, issued the
  # ALTER, and the next thing the client saw was
  # `mariadb.InterfaceError: Lost connection to server during query` -- the
  # ALTER KILLED THE SERVER. `incremental` on the same corpus and knobs built
  # and served correctly in the same run (recall@10=0.9895 at the smallest
  # grid ef_search, 8,263 qps at four clients), so it was the BULK path alone.
  # This key was false from then until the re-test below, and every profile
  # that named no mode built Percona incrementally.
  #
  # THE CURRENT PIN (9.7.2-2, `source.tag` above, x86-64-v3), 2026-11-03, on
  # a laptop (i9-12900HK), profile `percona-bulk-repro` (the same corpus,
  # 20,000 rows, 1 load thread, M=16, ef_construction=200, normalized): 25 OF
  # 25 ATTEMPTS BUILT. The ALTER took 3.4-5.8 s (median 3.8 s); mysqld's error
  # log held no error, signal or assertion, and no core was written with
  # `core_pattern` set to `core.%p`. Profile `percona-build-modes` then built
  # the full 60,000 rows both ways at this pin:
  #
  #                 load+build         index    recall@10  QPS 1/4 clients
  #   post          180.9 s + 14.1 s   289 MB   0.9714     5,895 / 19,233
  #   incremental   288 s              256 MB   0.9709     5,599 / 18,103
  #
  # (recall at ef_search 10), and filtered recall tag 10%/1% 0.988/0.996 vs
  # 0.989/0.997, ctag 11%/1.5% 0.987/0.924 vs 0.988/0.928 -- the same index
  # quality, built in two thirds of the time. 25 clean builds on one machine
  # bound how rare the old crash can be at this pin without proving it gone,
  # which is why the incident stays recorded here.
  bulk_vector_index_build: true
  # FALSE, AND DELIBERATELY NOT FLIPPED WITH THE KEY ABOVE: it is a different
  # statement, and it is the one that failed silently.
  #
  # The churn REPAIR, `PerconaDriver.maintain()`, issues `ALTER TABLE t1 DROP
  # KEY vi, ADD VECTOR KEY ..., ALGORITHM=INPLACE` on a table that ALREADY has
  # the index. Until this key existed it was withdrawn by
  # `bulk_vector_index_build: false` above, because both were one ALTER.
  # They are not one test. At the old pin, on `full-20261015-215006`, the
  # replace returned in 1-4 ms with `index_bytes` identical to the byte and
  # recall identical in all 20 before/after pairs -- a no-op, which the
  # report published as `after ALTER TABLE (index replace) (0.0 s)`. NOTHING
  # ABOUT IT HAS BEEN RE-TESTED AT THE CURRENT PIN: the 25 builds above are
  # the add on an unindexed table, not the replace.
  #
  # Read by `orchestrator/cli.py:_vector_index_replace` (which falls back to
  # `bulk_vector_index_build` for an engine that declares no such key, so no
  # other engine moved); `ops_pass.harness_args` emits
  # `--no-vector-index-replace`, `PerconaDriver.declare_vector_index_replace`
  # sets `repair_path` to "none", and `maintain()` runs nothing, so churn
  # writes its "before" record and no "after" one. No per-run opt-in exists,
  # for the reasons that hook's docstring gives.
  #
  # FLIP IT TO `true` only after a replace at this pin has been run by hand
  # (`run-benchmark.sh lab`, where the driver's class default issues it) and
  # shown to be a real rebuild: `index_bytes` that changes across it, a
  # duration on the order of the bulk build above (seconds at 20,000 rows,
  # not milliseconds), and recall that moves on a churned table.
  vector_index_replace: false

# Percona's optimizer CAN decline the index, but never for cost reasons, and
# the distinction decides what this guard is protecting against.
# vector-common/vector_constants.h gives vector index access
# `prohibitive_cost = 1e100`, "Chosen so that it always loses against any other
# access method, since a vector index is only ever activated for ORDER BY ...
# LIMIT" -- so activation is a SHAPE match, not a cost decision. That is the
# opposite of AliSQL, which costs the index against a full scan and picks the
# scan at larger LIMITs. The shapes that fall off the index are no LIMIT,
# ORDER BY ... DESC, a metric the graph was not built for, DISTANCE() only in
# WHERE, and both arguments non-constant. Each returns exact results slowly,
# which is the failure this check exists to make loud.
#
# The marker itself is NOT here and must not come back: the plan check lives in
# the driver (`MySQLDialect.plan_marker` = "vector_ann") and nowhere else. An
# `index_plan_marker` key in a config was both unread and wrong for both
# MariaDB versions.
plan_guard:
  verify_index_used: true
  force_index_hint: "FORCE INDEX (vi)"

# Runtime facts the orchestrator needs to start and speak to this engine.
runtime:
  # After valkey (60), which puts it last in every chart and table: the
  # original three first, then the engines added later. Directory discovery is
  # alphabetical and would have put it between mongodb and pgvector.
  order: 70
  driver: PerconaDriver
  # Class name ann-benchmarks expects in the generated config.yml. The
  # validator refuses a duplicate, and it must: ann-benchmarks keys result
  # files on this name, so two engines sharing one means the second reports
  # the first's recall -- which is the defect `mariadb123` exists to prevent.
  #
  # `PerconaSearch` is the MONGODB engine, not this one. The two names are
  # close enough to swap by accident and swapping them is exactly that defect.
  ann_constructor: PerconaServer
  port: 3306
  data_mount: /var/lib/vbench
  server_data_mount: /server-data/data
  # Where mysqld's own diagnostics land INSIDE the container. Must equal
  # LOG_FILE's default in docker/percona/entrypoint-percona.sh, which is what
  # it passes to --log-error; tests/test_e10_failures_explain_themselves.py
  # reads both and fails if they drift.
  #
  # This key exists because that is a path in the data volume and not a
  # stream: the container's stdout is the three-line entrypoint banner, and
  # teardown stops the container and removes the volume. In run
  # full-20261015-215006, 12 of 24 ops units died inside the first INSERT with
  # `mariadb.InterfaceError: Lost connection to server during query` within
  # 0.5-5.5 s, server RSS flat at the buffer-pool baseline and CPU at 0.16
  # cores -- and whether that was a signal, an assertion or a refused
  # statement could not be established afterwards, because every
  # logs/percona-server-*.log in that run is the banner and the file that
  # would have said was deleted with the volume. ops_pass copies this out
  # before teardown.
  #
  # THE COUNT WAS 13 UNTIL A RESUME MOVED IT, and that is recorded here
  # because the next reader will re-derive it and reach a different number.
  # During the original pass (2026-10-15T21:50Z to 2026-10-17T15:42Z) thirteen
  # of the twenty-four ops-percona-*.jsonl files were empty. A `--resume` of
  # the same run id on 2026-10-19 re-ran fashion-mnist-784-euclidean /
  # normalized / M=16 and it SURVIVED -- 20 records stamped 08:45-08:55Z --
  # which is what leaves twelve. So the figure was never an arithmetic error;
  # it was a statement about a run that was still moving, and the
  # percona-only export taken on 2026-10-18 still shows thirteen and carries
  # no checkpoint for that unit while the seven-engine bundle shows twelve and
  # does.
  #
  # The "12 of 18" million-row figure in docs/12 is NOT in conflict with
  # either number and was not evidence against 13: the eighteen million-row
  # configurations (gist, glove, sift x two passes x three M values) held
  # twelve empty files both before and after the resume, and the unit the
  # resume recovered is fashion-mnist, which is 60,000 rows. 12 + 1 = 13 then,
  # 12 + 0 = 12 now.
  error_log: /var/lib/vbench/percona.err
  # UNLIMITED CORE SIZE, and it is the second of the three things a usable
  # core needs -- `server.common`'s --core-file is the first and the host's
  # kernel.core_pattern is the third. A container inherits the docker
  # daemon's own RLIMIT_CORE, which on a stock install is whatever started
  # dockerd, so mysqld can be asked to dump and still produce a core
  # truncated at that limit. A truncated core is worse than none: gdb opens it
  # and prints a backtrace that stops where the file does, and the reader has
  # no way to tell that from a stack that really ends there.
  #
  # Per-engine rather than a global default, so the six engines that are not
  # under investigation keep the `docker run` argv they had.
  #
  # NOTHING A RUN LEAVES BEHIND RECORDS THIS VALUE, and that is worth knowing
  # before trusting a core's size. `Manifest.set_engine` writes an engine's
  # source, build, images and presentation and NOT this runtime block, and the
  # `exec mysqld ...` banner that ops_pass archives carries the SERVER flags
  # only -- --ulimit is a docker flag and never reaches mysqld's argv. So the
  # limit in force when a core was written is whatever this file said at the
  # time, and the only way to tell is the commit.
  #
  # Quoted, because YAML would otherwise read -1 as an integer. `docker run
  # --ulimit core=-1` takes either, but the registry stringifies and a
  # quoted value is what the test asserts.
  ulimits:
    core: "-1"
  credentials:
    user: "bench"
    password: "bench"
  group: extra
  probe:
    - "sh"
    - "-c"
    - "/opt/percona/bin/mysql -ubench -pbench --socket=/var/run/vbench/percona.sock -e 'SELECT 1' >/dev/null 2>&1"
  # #ff7f0e and `P` are both unused by the six engines already in the charts
  # (#1f77b4, #d62728, #2ca02c, #5fa8d3, #9467bd, #e377c2; o, s, ^, s, v, D).
  #
  # webui/static/fields.js carries a SECOND copy of the colour and the label
  # and must match this block character for character. The front end is static
  # and cannot read this registry, so that is the one place in the addition
  # where two files are kept in step by hand.
  chart:
    color: "#ff7f0e"
    marker: "P"
    linestyle: "-"
    label: "Percona Server (InnoDB HNSW)"
  label: "Percona Server (InnoDB HNSW)"
  # The index the ops pass builds. §4's secondary table ("at the build the
  # ops pass measured") is taken from it, and a headline floor figure from any
  # other build is marked, because the load, build, concurrency, filtered and
  # churn sections describe this index. `full-20260825` published Percona
  # Search's floor figures from the unquantized sweep beside ops figures from
  # the scalar index (which peaks at recall 0.892), and
  # pgvector's and Valkey's from efC=400 beside ops figures at 200 and the
  # server default. A value of `ops` is resolved per profile and
  # pass from what `orchestrator/ops_pass.py` passes the harness
  # (`orchestrator/reference_build.py`), and `cmd_run` refuses a build the ann grid
  # does not contain rather than reporting "—" for a whole engine afterwards.
  # A literal: the ops pass passes no `--ef-construction` for this engine, so
  # `PERCONA_DIALECT.ef_construction` (200, the server's own default) builds
  # every ops index, while the tuned `percona` profile sweeps 50/200/800.
  reference_build:
    m: 16
    ef_construction: 200
