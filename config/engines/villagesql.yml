# VillageSQL engine definition.
#
# Vector support: the vsql_vector EXTENSION on VillageSQL Server, a MySQL 9.7.2
# fork with an extension framework, built from villagesql/vsql-vector-pk
# (GPL-2.0): the vsql-vector build whose HNSW index stores each row's primary
# key. It installs as `vsql_vector`, like plain vsql-vector, and a server runs
# one or the other. The column is a custom type, `SVECTOR(n)`, stored by the
# extension in its own InnoDB pages inside the table's tablespace; the index is
# a custom index, `INDEX vi (v hnsw_<metric>) USING EXTENDED(hnsw) WITH (M =
# .., ef_construction = ..)`, whose graph also lives in InnoDB pages of
# `t1.ibd`. Both are PREVIEW features at this pin: custom index DDL is refused
# unless `vsql_allow_preview_extensions=ON`, and the extension links
# VillageSQL's dev/unstable ABI. Every statement is built in
# harness/drivers/villagesql.py; docs/04-engine-notes.md carries the list of
# traps.
#
# WHY -pk AND NOT vsql-vector. The server drives a KNN distance scan only from
# a custom index whose storage props include HAS_ROW_REF
# (`FindCustomKnnIndexOnField` in
# villagesql/sql/custom_index_knn_recognition.cc, gate from server PR #1269).
# Plain vsql-vector's HNSW declares HAS_COLUMN_REF | REF_LOOKUP, so with it
# every `ORDER BY L2_DISTANCE(v, ..) LIMIT k` is a sort over a full table scan
# with recall 1.000 -- measured on this engine's first pin (server
# publish/mysql-9.7_0.0.7, vsql-vector bac885d, 2026-10-30), which therefore
# ran the build workload only. vsql-vector-pk declares HAS_ROW_REF, and with it
# EXPLAIN FORMAT=TREE shows `Custom index distance scan on vi` under the
# default (classic) optimizer, on this 9.7 server and on the 8.4 one
# config/engines/villagesql84.yml builds.
#
# WHAT THIS PIN CAN AND CANNOT DO, measured on the 8.4 build of the same
# extension commit (villagesql84), whose KNN recognition and custom-index DML
# layer are the same code as 9.7's:
#
#   * build, incremental -- CREATE TABLE ... INDEX vi (...) USING EXTENDED(hnsw)
#     then INSERT: works, the graph is maintained on every INSERT.
#   * build, post -- CREATE INDEX over a loaded table: not the default (see
#     `capabilities.bulk_vector_index_build`).
#   * search uses the index, and the driver and the ann module still check the
#     plan and refuse to time a query whose plan lacks "Custom index distance
#     scan on vi", so a future pin that loses the scan fails loudly.
#   * DELETE is rejected -- churn is declined.
#   * a WHERE beside the KNN ORDER BY is applied after the scan, to its top
#     max(ef_search, LIMIT) candidates -- filtered search is declined.
name: villagesql
display_name: VillageSQL on MySQL 9.7 (vsql_vector)
family: mysql

source:
  # The vsql-vector-pk commit, under the key every other engine uses
  # (`orchestrator/engines.py:_source_tag`, `ops_pass` -> VB_ENGINE_TAG).
  # Release 0.0.3 (tag `0.0.3`), `main` at "Bump version to 0.0.3 (#33)".
  tag: 93ed00873dd65f64c0788c80576d5cf3fba39831
  upstream: https://github.com/villagesql/vsql-vector-pk.git
  # The server the extension is compiled against, from source -- VillageSQL
  # 0.0.7 on its MySQL 9.7.2 base, the same upstream server line and point
  # as Percona Server and MyVector here. config/engines/villagesql84.yml
  # compiles the same extension commit against the 8.4 line. The extension
  # links the server's build tree, so both come out of one build.
  server_tag: publish/mysql-9.7_0.0.7
  # Asserted by `prepare_villagesql`: a moved tag is a different server under
  # the same label.
  server_commit: 533ab4b58d2744b79bb45e41f44fa928f190a655
  server_upstream: https://github.com/villagesql/villagesql-server.git

image:
  runtime: vector-bench/villagesql-runtime
  bench: vector-bench/villagesql-bench
  base: ubuntu:24.04

build:
  # The server's build type. The EXTENSION -- where the distance kernels
  # live -- is always compiled Release (-O3) and the Dockerfile fails the
  # build if no optimisation flag reaches it.
  type: RelWithDebInfo
  march: x86-64-v3
  # docker/myvector/Dockerfile's list (a MySQL 9.7.2 tree), unchanged.
  cmake_flags:
    - -DWITH_PACKAGE_FLAGS=OFF
    - -DWITH_ROUTER=OFF
    - -DWITH_MYSQLX=OFF
    - -DWITH_NDB=OFF
    - -DWITH_NDBCLUSTER=OFF
    - -DWITH_RAPID=OFF
    - -DWITH_UNIT_TESTS=OFF
    - -DWITH_SSL=system
    - -DWITH_ZLIB=bundled
    - -DWITH_ZSTD=bundled
  extra_cxxflags: ""

# There is deliberately no `sql:` block -- see config/engines/mariadb.yml and
# tests/test_c1_engine_sql.py. Every statement is built in
# harness/drivers/villagesql.py.

server:
  common:
    - --skip-name-resolve
    # The preview gate. Also passed by the entrypoint so a by-hand start works;
    # stated here so the run's server flags record it.
    - --vsql-allow-preview-extensions=ON
  normalized:
    - --innodb-buffer-pool-size={buffer_bytes}
    - --innodb-flush-log-at-trx-commit=2
    - --innodb-doublewrite=0
  tuned:
    - --innodb-buffer-pool-size={buffer_bytes}
    - --innodb-flush-log-at-trx-commit=0
    - --innodb-doublewrite=0
    - --innodb-flush-method=O_DIRECT
    - --skip-log-bin
  # Opt-in, ops path only, exactly as config/engines/myvector.yml: rendered
  # after the pass's flags when a profile sets `ops.server_wait_instruments:
  # true`, and recorded in
  # `engines_resolved` and on every record when it is. The driver's wait
  # snapshot is MySQLFamilyDriver's performance_schema read, unchanged; the
  # extension's own page latches are taken through InnoDB's buffer pool
  # (`storage_abi.cc` `buf_page_get`), so they show up under InnoDB's
  # instruments rather than under any of the extension's. Not yet observed
  # on a live VillageSQL server.
  wait_instruments:
    - --performance-schema=ON
    - --performance-schema-instrument=wait/synch/mutex/%=ON
    - --performance-schema-instrument=wait/synch/rwlock/%=ON
    - --performance-schema-instrument=wait/synch/sxlock/%=ON

storage_engines:
  normalized: [InnoDB]
  tuned: [InnoDB]

capabilities:
  ef_construction_tunable: true
  m_per_index: true
  requires_read_committed: false
  # FALSE, and the driver declines the workload: see the header. Read by the
  # estimator (`estimate._runs_filtered_search`) so no hours are charged for it.
  filtered_search: false
  # FALSE, and the driver declines the workload: DELETE is rejected on a
  # table carrying a custom index at this pin. Read by the estimator.
  churn: false
  # FALSE: the bulk build (`CREATE INDEX vi ON t1 ... USING EXTENDED(hnsw)`
  # over a loaded table) can KILL THE SERVER. On this engine's first pin
  # (vsql-vector bac885d) two connections' worth of X-latches on extension
  # pages, both taken at the storage ABI's page get
  # (storage/innobase/villagesql/storage_abi.cc, `buf_page_get` under
  # `vef_storage` page access), waited on each other; InnoDB's error monitor
  # reported "DEADLOCK of threads detected!" and aborted with
  # `[FATAL] ... sync0arr.cc:678` (signal 6): 3 aborts in roughly 20 bulk
  # builds, 0 in 12 incremental builds (measured 2026-10-30). vsql-vector-pk's
  # README says the same of this pin: building an HNSW index over an
  # already-populated table "is not safe yet and can crash the server". So the
  # default build mode is `incremental` (`cli._ops_build_modes` reads this
  # key), the ann module declares the index in CREATE TABLE, and a profile can
  # still ask for `post` explicitly to re-test a newer pin.
  bulk_vector_index_build: false

runtime:
  order: 90
  # OPT-IN: a run that names no engines leaves VillageSQL out and prints so;
  # `--engines villagesql` (alone or in a list) runs it.
  default_selected: false
  driver: VillageSQLDriver
  ann_constructor: VillageSQL
  port: 3306
  data_mount: /var/lib/vbench
  server_data_mount: /server-data/data
  # Must equal LOG_FILE's default in docker/villagesql/entrypoint-villagesql.sh.
  error_log: /var/lib/vbench/villagesql.err
  credentials:
    user: "bench"
    password: "bench"
  group: extra
  probe:
    - "sh"
    - "-c"
    - "/opt/villagesql/bin/mysql -ubench -pbench --socket=/var/run/vbench/villagesql.sock -e 'SELECT 1' >/dev/null 2>&1"
  chart:
    color: "#8c564b"
    marker: "h"
    linestyle: "--"
    label: "VillageSQL 0.0.7 on MySQL 9.7 (vsql_vector-pk HNSW)"
  label: "VillageSQL 0.0.7 on MySQL 9.7 (vsql_vector-pk HNSW)"
  # The index the ops pass builds, and the fallback under
  # `ops.build_selection: frontier` when the ann phase gives no usable point.
  # `ef_construction: ops` resolves through `ops_pass.ops_ef_construction` to
  # `ann.villagesql_ef_construction` (default 200), the key the ann render
  # reads in the normalized pass. M=16 at 200 is inside vsql_vector's
  # M <= ef_construction <= 32 x M (`orchestrator/ann_knobs.py`).
  reference_build:
    m: 16
    ef_construction: ops
