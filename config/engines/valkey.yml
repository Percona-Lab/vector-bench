# Valkey + valkey-search engine definition.
#
# The fourth architecture, and the only in-memory one. The MySQL family and
# pgvector keep a disk-backed table with a cache in front; Percona Search keeps
# the index in a separate process; Valkey keeps everything in RAM, always. There
# is no buffer pool to size, no cache-hit ratio to reason about, and no on-disk
# index: the container limit is not a cache budget, it is the dataset.
#
# WHAT IT ADDS TO THE COMPARISON
#
#   * It is the second engine to expose ef_construction, which pgvector was
#     previously alone in having. The normalized pass still pins it, because
#     MariaDB and AliSQL still lack it, but the reason is now "two of four" and
#     the report says so.
#
#   * It documents a lock-free read path with a reader thread pool and linear
#     scaling with cores. Our measured result is that MariaDB and AliSQL are
#     flat from one client to thirty-two while pgvector reaches 21.7x, so this
#     is the most directly testable claim in the set.
#
#   * Its documentation describes a query planner that chooses between
#     pre-filtering and inline filtering per query. The run of 2026-08-25 did
#     not observe that: filtered latency rose from 18.2 ms at 10% selectivity
#     to 120.6 ms at 1%, which is what walking the graph costs and the inverse
#     of what pre-filtering costs. scripts/probe-valkey-filter.py exists to
#     find out whether the planner is reachable from a plain FT.SEARCH at all.
#     The report derives each engine's strategy from its own latency rather
#     than from this note.
#
# THE TRAP THIS CONFIG EXISTS TO AVOID
#
# If Valkey reaches maxmemory under any policy other than noeviction it evicts
# keys. Vectors would disappear mid-run and recall would fall in a way that
# looks exactly like a bad index. maxmemory-policy is pinned to noeviction and
# the driver checks evicted_keys after the load, so this fails loudly instead
# of being measured.
name: valkey
display_name: Valkey + valkey-search
family: valkey

source:
  # Percona's Valkey repository, enabled through percona-release.
  #
  # This is the one engine whose provenance is a package rather than a git tag
  # or an image digest. The repository is pinned by name and the installed
  # package versions are read back from the image and recorded in the manifest,
  # because "whatever valkey-91 held on the day we built" is not a
  # reproducible statement and the report has to be able to say which build ran.
  kind: percona_repo
  repository: valkey-91
  # Used as the image tag: there is no git tag to name this build by.
  version: "9.1"
  # Verified on the build host rather than assumed: build-images fails with the
  # available package list if a name here does not resolve, which is cheaper
  # than discovering it after the corpus is loaded.
  packages:
    # The server, the client (valkey-cli, which the entrypoint and the
    # readiness probe both use) and the search module. Not
    # percona-valkey-bundle: that pulls audit, bloom, json and ldap as well,
    # which is more surface in the measured process for no benefit here.
    - percona-valkey-server
    - percona-valkey-tools
    - percona-valkey-search
  # Where the module lands is asked of dpkg at build time rather than guessed,
  # and written into the image. This value is only the fallback hint. The
  # entrypoint refuses to start without the module, since a Valkey lacking it
  # accepts every write and then fails every query.
  module_path: /usr/lib/valkey/modules/libsearch.so
  # Filled in at build time from the installed packages.
  installed_versions: null

image:
  runtime: vector-bench/valkey-runtime
  bench: vector-bench/valkey-bench
  base: debian:bookworm-slim   # percona-release supports Debian 12

build:
  # Nothing is compiled by us. Percona's packages are prebuilt, so the -march
  # every other engine records does not apply and claiming one would be false.
  # This is the same provenance gap Percona Search has, for the same reason,
  # and the report states it the same way.
  march: none
  optflags: ""

valkey:
  index_name: idx
  key_prefix: "v:"
  vector_field: embedding
  tag_field: tag
  # FLOAT32 little-endian, which is what the module expects in PARAMS and what
  # every other engine here stores.
  vector_type: FLOAT32
  # DIALECT 2 is required for the =>[KNN ...] query form.
  dialect: 2
  metrics:
    angular: COSINE
    euclidean: L2
  # HNSW only. FLAT is exact search, so it belongs to ground truth rather than
  # to a comparison of approximate indexes.
  algorithm: HNSW

server:
  common:
    # Persistence is turned off in the entrypoint instead: `--save ""` needs an
    # empty argument, and these flags are joined into an environment variable
    # and word-split back apart, which drops it.
    #
    # See the trap above. Not negotiable per pass.
    - --maxmemory-policy
    - noeviction
  normalized:
    - --maxmemory
    - "{maxmemory_bytes}"
    - --io-threads
    # Clamped, not the cpuset. See cpu.max_io_threads.
    - "{io_threads}"
  tuned:
    - --maxmemory
    - "{maxmemory_bytes}"
    - --io-threads
    # Clamped, not the cpuset. See cpu.max_io_threads.
    - "{io_threads}"

resources:
  # No buffer pool and no graph cache: the dataset is resident by definition.
  # What the container budget has to hold is the vectors, the HNSW graph and
  # Valkey's per-key overhead, so it is handed to maxmemory rather than split.
  in_memory: true
  # Headroom below the container limit for replication buffers, client output
  # buffers and fragmentation. Hitting the container limit gets the process
  # OOM-killed; hitting maxmemory with noeviction returns an error, which is
  # recoverable and diagnosable.
  maxmemory_fraction: 0.9

storage_engines:
  normalized: [memory]
  tuned: [memory]

capabilities:
  # No longer unique to pgvector. The normalized pass still pins it, because
  # MariaDB and AliSQL still do not have it, but the asymmetry is now two
  # engines against two rather than one against three.
  ef_construction_tunable: true
  ef_construction_normalized: 200
  # Documented lock-free read path with a reader thread pool.
  reader_thread_pool: true
  # Documented, not observed. It is recorded as null rather than true because
  # this field lands in the records, and a `true` there reads as a measured
  # fact -- which is exactly how the claim survived into the report for weeks.
  # See the note at the top of this file.
  hybrid_filter_planner: null
  # Nothing is written to disk, so the on-disk footprint comparison does not
  # include it and index size is measured as resident bytes.
  in_memory_only: true

# Runtime facts the orchestrator needs to start and speak to this engine.
#
# These used to be six dictionaries keyed by engine name, spread across
# ann_pass, ops_pass, cli, charts and render. Adding an engine meant finding all
# six, and missing one produced a failure hours later rather than at load. They
# live here because everything else about an engine already does.
runtime:
  # Which harness driver drives it. A new *architecture* needs a new
  # driver in harness/drivers/; a new variant of this family does not.
  # Presentation and iteration order. Discovery is by directory, which is
  # alphabetical, and alphabetical is not the order this comparison is read
  # in -- the original three come first.
  order: 60
  driver: ValkeyDriver
  # Class name ann-benchmarks expects in the generated config.yml.
  ann_constructor: ValkeySearch
  port: 6379
  # Where the server keeps its data inside the image.
  data_mount: /var/lib/vbench
  # No read-only sizing mount: the index is not a separate on-disk artifact.
  server_data_mount: null
  credentials:
    user: ""
    password: ""
  # Opt-in engines are not in the original three-way comparison.
  group: extra
  # Readiness probe, run inside the server container until it succeeds.
  probe:
    - "sh"
    - "-c"
    - "valkey-cli MODULE LIST 2>/dev/null | grep -qi search"
  chart:
    # Its own hue as well: the only in-memory engine, so it should not
    # read as a variant of any disk-backed one.
    color: "#e377c2"
    marker: "D"
    linestyle: "-"
    label: "Valkey (valkey-search)"
  label: "Valkey (valkey-search)"
  # The index the ops pass builds. §4's secondary table ("at the build the
  # ops pass measured") is taken from it, and a headline floor figure from any
  # other build is marked, because the load, build, concurrency, filtered and
  # churn sections describe this index. `full-20260825` published Percona
  # Search's floor figures from the unquantized sweep beside ops figures from
  # the scalar index (which peaks at recall 0.892), and
  # pgvector's and Valkey's from efC=400 beside ops figures at 200 and the
  # server default. A value of `ops` is resolved per profile and
  # pass from what `orchestrator/ops_pass.py` passes the harness
  # (`orchestrator/reference_build.py`), and `cmd_run` refuses a build the ann grid
  # does not contain rather than reporting "—" for a whole engine afterwards.
  # A literal, because the ops pass passes no EF_CONSTRUCTION and the driver
  # then omits it from FT.CREATE: the server default builds the index.
  # valkey-search's default is 200 (`kDefaultEFConstruction` in
  # src/commands/ft_create_parser.h, and "The default value is 200" in its
  # FT.CREATE documentation), which is also what the ann module pins.
  reference_build:
    m: 16
    ef_construction: 200
