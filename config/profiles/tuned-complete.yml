# Everything, in one run, under one configuration.
#
# Every engine, both MariaDB versions, all five measurements: recall against
# throughput, index build cost, concurrency, filtered search and churn.
#
# WHY ONE RUN RATHER THAN SEVERAL
#
# Results spread across runs with different resource splits carry a caveat on
# every cross-run comparison. Measuring one thing here and another there
# attributes to the engine a difference that is partly the budget. One run, one
# split, and the differences mean something.
#
# WHY NO MyISAM
#
# It used to sweep InnoDB and MyISAM, and the run of 2026-08-17 answered what
# that was for. MyISAM won on every axis measured: 84% more single-client
# throughput at recall 0.99, a sixth of the build time, half the memory and
# half the disk, and 10% throughput lost to churn where InnoDB lost 86%. It did
# not lift the concurrency ceiling, which was the open question that justified
# measuring it -- MariaDB is flat from one client to thirty-two on both.
#
# None of which makes it deployable. MyISAM is not transactional, so it is not
# a configuration vector search runs on in production, and measuring it costs
# about eight hours a run to produce numbers nobody can act on.
#
# The capability is still there. Set mariadb_storage_engines below, and
# extras.mariadb_storage_engines in config/resources/tuned.yml, to
# [InnoDB, MyISAM]. The report keeps its per-storage-engine handling either
# way, so the 2026-08-17 results remain readable.
#
# COST. Roughly 40 hours. The 2026-08-17 run took 49.7 h with MyISAM in it.
# Nearly all of that is loading: the ann and ops phases each load the corpus
# independently, and there is no way around it, because an ops unit builds its
# own volume, loads, measures and tears down. Nothing can be shared with a
# phase that ran earlier.
#
# Run it with:
#   ./run-benchmark.sh run --profile tuned-complete \
#       --engines mariadb,mariadb123,alisql,pgvector
#
# --engines mariadb,alisql,pgvector drops MariaDB 12.3 and saves about 11 h.
# It still answers every question on 11.8.
name: tuned-complete
description: Every engine, all five measurements, one configuration (~40 h)

datasets:
  - dbpedia-openai-1000k-angular

k: 10
runs: 2
# Publishable: a report is written from this profile, so it measures every
# ann point at least twice (`runs: 2`). With one run, the first configuration
# of every sweep was a single draw on a cold index -- full-20260825 (a
# tuned-complete run at `runs: 1`) published
# ef_search 10 slower than ef_search 20 on every MySQL-family curve -- and
# tests/test_config.py refuses `runs < 2` on any profile marked publishable.
publishable: true
default_resource_pass: tuned

resources:
  cpu:
    # One client CPU per two clients of the largest count below, never fewer
    # than four: 16 for the 1-32 sweep, which is what this line pinned by hand
    # before `auto` existed. The ann fingerprint hashes the resolved count, so
    # the switch did not move this profile's results tree; a host whose pool
    # cannot spare 16 after the server set now refuses the run instead of
    # quietly sharing cores.
    client_cpus: auto
  # No extras override: the tuned pass resolves memory from host_fraction and
  # sweeps InnoDB only, which is what this profile wants.

ann:
  # On, so recall lands in the same run and the same CPU split as everything
  # else. The curves exist already in mariadb-blog-repro, but that run used
  # eight client cores against sixteen here, which changes server_cpu_count and
  # therefore the results fingerprint. Reusing them would mean one report whose
  # recall came from a different machine shape than its concurrency.
  enabled: true
  m_values: [16]
  ef_search: [10, 20, 40, 80, 120, 200, 400, 800]
  insert_threads: 8
  mariadb_storage_engines: [InnoDB]

ops:
  enabled: true
  workloads: [build, concurrency, filtered, churn]
  # Measure the build the headline is taken from. The report's headline is
  # each engine's Pareto frontier over everything the ann phase swept, and a
  # fixed M=16 ops build would put concurrency and churn from one index beside
  # a frontier figure from another. `frontier` picks, per engine and dataset,
  # the swept build fastest at the calibration target (0.95), after the ann
  # phase and from its results; it falls back to the engine's declared
  # reference build -- loudly -- when the ann phase left nothing to choose
  # from. `m_values` below then applies only where the chosen build names no
  # M (Percona Search, whose M is a label). See
  # orchestrator/ops_build_selection.py.
  build_selection: frontier
  m_values: [16]
  ef_search: 100
  subset_rows: null
  load_threads: 8
  max_queries: 500
  # The same grid the equal-budget run used, so the two are directly
  # comparable. The knee is between 1 and 4, which is why those points are all
  # present.
  # No 2-client point: at n=2 both estimators of the achieved
  # concurrency equal exactly the floor, so the verdict is noise.
  # config/profiles/main.yml carries the measurement.
  client_counts: [1, 4, 8, 16, 32]
  concurrency_duration_s: 60
  # Three windows per client count, median reported with the spread beside it.
  # Every figure in the 2026-08 run was a single sample, and the one point that
  # happened to be re-measured came back 21% higher at sixteen and thirty-two
  # clients -- enough to cover the gap between two engines that were being
  # presented as ordered. Concurrency is the headline finding and the cheapest
  # thing here to repeat: about fifteen extra minutes per engine on a run that
  # takes days.
  concurrency_repeats: 3
  selectivities: [0.10, 0.01]
  churn_fractions: [0.10]
  # Two hours, not the thirty-minute default.
  #
  # The budget exists so that an engine which takes a write and never finishes
  # it releases the machine instead of holding the run overnight -- which is
  # what Valkey did before its pipelined-write defect was found. Thirty minutes
  # was sized against that failure, not against a healthy engine.
  #
  # MHNSW and VIDX maintain the graph on every INSERT, so writing 99,000 rows
  # back into a populated index takes them 58 to 99 minutes. All three were cut
  # off at roughly 1,830 seconds with the re-insert unfinished, and the run
  # recorded no churn result for any of them: the recall and throughput they
  # would have had after churn are simply absent, and that was the study's
  # largest single finding.
  #
  # Two hours clears the slowest observed re-insert with margin and is still
  # far short of holding a run overnight.
  churn_budget_s: 7200
