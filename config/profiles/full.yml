# Full profile — the one the report is written from.
#
# Four datasets spanning low-to-high dimensionality and both metric spaces, a
# dense enough M x ef_search grid to draw a clean Pareto frontier, and all four
# ops dimensions at full depth. Expect a day or more per resource pass; the
# orchestrator checkpoints per (engine, dataset, config) so an interruption
# costs one data point, not the run.
name: full
description: Dense sweep across four datasets, all workloads (24h+ per pass)

datasets:
  - fashion-mnist-784-euclidean
  - glove-100-angular
  - sift-128-euclidean
  - gist-960-euclidean

k: 10
runs: 3
# Publishable: a report is written from this profile, so it measures every
# ann point at least twice (`runs: 2`). With one run, the first configuration
# of every sweep was a single draw on a cold index -- full-20260825 (a
# tuned-complete run at `runs: 1`) published
# ef_search 10 slower than ef_search 20 on every MySQL-family curve -- and
# tests/test_config.py refuses `runs < 2` on any profile marked publishable.
publishable: true

ann:
  enabled: true
  # THREE values, not seven. ann-benchmarks reloads the entire dataset for every
  # M, and MHNSW and VIDX build their graphs incrementally at a few hundred rows
  # per second — so each extra M costs a full reload of every dataset. At seven
  # values the load time alone was ~16 h per pass for MariaDB and ~42 h for
  # AliSQL, before a single query ran; across both passes that is roughly five
  # days of pure ingest. Three values still define a Pareto frontier.
  #
  # Raise this only if you have measured how long a load takes on your hardware
  # and have the days to spare. pgvector is unaffected either way: its bulk
  # build is ~15x faster than the incremental builders.
  m_values: [8, 16, 32]
  ef_search: [10, 20, 40, 80, 120, 200, 400, 800]
  pgvector_ef_construction: 200
  pgvector_build_modes: [post, incremental]
  batch: false
  # MyISAM is a MariaDB-only extra curve; AliSQL's VIDX is InnoDB-only, so it
  # never appears in the three-way comparison. Reported separately and labelled.
  mariadb_storage_engines: [InnoDB]

ops:
  enabled: true
  workloads: [build, concurrency, filtered, churn]
  m_values: [8, 16, 32]
  ef_search: 100
  subset_rows: null
  load_threads: 1
  max_queries: 2000
  # No 2-client point: at n=2 both estimators of the achieved
  # concurrency equal exactly the floor, so the verdict is noise.
  # config/profiles/main.yml carries the measurement.
  client_counts: [1, 4, 8, 16, 32]
  concurrency_duration_s: 30
  # See main.yml for why: a single window has no error bar, and two engines
  # differing by less than the window-to-window spread were being presented
  # as ordered. 6 points x 30 s x 3 is 9 minutes per engine-dataset pair plus
  # warm-up. `concurrency_queries` stays unset here too — its default is the
  # whole test set, and setting it is the way back to a small pool.
  concurrency_repeats: 3
  selectivities: [0.01, 0.10, 0.50]
  churn_fractions: [0.10, 0.25]
  # pgvector 0.8 only. Filtered search behaves very differently per mode, so
  # the mode is stated rather than left at the vendor default -- and both of
  # these are now measured, where `cli.py:_ops_iterative_scan` used to pin the
  # first and drop the rest. That is what made the 2026-10-15 run publish 49
  # of pgvector's 72 filtered points below 0.6 recall, all of them at `off`,
  # with recall sitting on the selectivity itself.
  #
  # TWO of the three modes `config/engines/pgvector.yml` declares. This
  # comment read "all three" while the list held two for as long as the list
  # existed, and nothing caught it because neither entry ran: `strict_order`
  # has never been measured here. Adding it costs this grid a third time for
  # pgvector alone, which is a scope decision and not a comment fix.
  pgvector_iterative_scan: [off, relaxed_order]
