# Smoke profile — the gate every long run must pass first.
#
# Proves the whole pipeline end to end for every engine: images build,
# servers start, vector DDL is accepted, the index is actually used, records
# are written, charts render and the report generates. It is not a
# measurement — the grids are far too sparse to draw a Pareto curve from.
#
# Measured on a Xeon Gold 6230: ~30 min for one resource pass, ~57 min for
# both. AliSQL dominates it at ~55 rows/s ingest. An earlier version of this
# file claimed 15 minutes, which was wrong.
#
# THOSE TIMINGS PREDATE PERCONA AND DO NOT INCLUDE IT. Nothing has measured
# Percona's ingest rate -- `orchestrator/estimate.py` names it in
# `engines_without_ingest_rate` rather than modelling it -- so "AliSQL
# dominates it" is a claim about the six engines that were measured, and this
# profile is the run that will settle whether it is still true. Percona builds
# its HNSW graph inside every INSERT by default, which is AliSQL's shape
# rather than pgvector's.
#
# Two things this gate deliberately does NOT cover, both recorded in
# docs/09-adding-percona-server.md:
#
#  * `innodb_hnsw_max_memory`. Percona's is a hard allocation ceiling and not
#    a cache, so exceeding it fails the statement. This profile's worst case
#    is 0.19 GiB of graph against a 1 GiB compiled-in default, so the gate
#    cannot surface the limit at all and passing it is not evidence that the
#    default would have held on `main`. The engine config sets the knob to 0
#    (unlimited) for exactly that reason; provoking the limit deliberately on
#    a throwaway run is docs/09 §5 item 2.
#  * The ann build-mode comparison. The ops harness measures both of Percona's
#    build modes; the ann overlay module has no `build_mode`, so
#    `ann.percona_build_modes` is refused at render time rather than producing
#    two identical curves. See orchestrator/ann_pass.py's percona branch.
name: smoke
description: End-to-end pipeline validation, all eight default engines (villagesql is opt-in), all charts (~45 min/pass)

datasets:
  - fashion-mnist-784-euclidean

k: 10
runs: 1

ann:
  enabled: true
  m_values: [16]
  ef_search: [10, 40, 160]
  # pgvector's ef_construction is pinned to its default; it is the one build
  # knob MariaDB and AliSQL do not expose (see docs/05-methodology.md).
  pgvector_ef_construction: 200
  # Both modes, deliberately. `post` is pgvector's idiomatic bulk build;
  # `incremental` mirrors what MHNSW and VIDX are forced to do and is the
  # like-for-like build comparison. The smoke profile is the gate before every
  # long run, so it must exercise both code paths — an incremental-mode bug
  # would otherwise only surface hours into the full sweep.
  pgvector_build_modes: [post, incremental]
  batch: false
  mariadb_storage_engines: [InnoDB]

ops:
  enabled: true
  workloads: [build, concurrency, filtered, churn]
  m_values: [16]
  ef_search: 100
  # Only load part of the training set so a failure surfaces in minutes.
  subset_rows: 20000
  load_threads: 1
  max_queries: 200
  client_counts: [1, 4]
  concurrency_duration_s: 8
  selectivities: [0.10]
  churn_fractions: [0.10]
