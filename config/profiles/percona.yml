# Percona-only profile — the two questions only this engine can answer.
#
# NOT a comparison profile. It runs one engine, so nothing here contributes to
# the seven-way chart; `main` and `full` do that. What this measures is two
# within-engine axes that have no counterpart on MariaDB or AliSQL, which is
# exactly why they do not belong in `main`: an axis only one engine has would
# add a dimension to the shared grid that the other six cannot be placed on.
#
# WHAT HAS RUN, AND HOW TO FIND OUT -- DO NOT TRUST A LIST HERE. This comment
# has now been wrong four times in four different ways. It said "NOTHING HERE
# HAS EVER BEEN RUN" after the profile had run. It then named two runs, and
# then three, when seven directories carry this profile's name. It said the
# normalized vendor-default curve did not exist when it does. And it counted
# result cells as this profile's when the ann tree they live in is shared, so
# some of them were produced by a wider grid run from somewhere else. Each
# time the cause was the same: the results live OUTSIDE this repository, so
# nothing here contradicts a stale enumeration -- and each repair enumerated
# something new. So this comment states the QUERY instead of the answer.
#
# THE QUERY. Runs of this profile are the directories whose
# `run-manifest.json` has `config.profile.name == "percona"`, across BOTH
# result trees -- `ALL_RESULTS/results/` and `PS/` -- because `PS/` holds
# copies of some of the same runs under the same ids, so anything counted
# across both trees must be deduped by run id first. At the time of writing
# that is seven directories, and the shape of them is the point rather than
# the number: five executed Percona phases, two of those five failed with
# `exit_code: 1`, one completed having run `mariadb123` and no Percona phase
# at all, one has `phases: []`, and one ran all SEVEN engines despite the
# `engines: [percona]` below. A directory named for this profile is therefore
# not evidence that this profile measured anything; its `phases` entries are.
#
# WHAT IS ACTUALLY MISSING, stated so it stays true: no run of THIS profile
# has executed a normalized ANN phase. The normalized ops unit has run, and
# the vendor-default recall/QPS curve DOES exist -- `full-20261015-215006`
# carries a complete normalized Percona curve on this dataset at M=16 with
# `ef_construction` at the default, among 56 normalized Percona `recall_qps`
# rows -- it just was not produced from here. Also never run from here: the
# second build mode (`post`, blocked by
# `capabilities.bulk_vector_index_build` until the 2026-11-03 re-test at the
# current pin restored it to `percona_build_modes` below -- the separate
# profile `percona-build-modes` measured it instead), and churn, which
# `workloads` below excludes on purpose.
#
# AND THE ANN TREE IS SHARED, which is why a cell appearing under a run id is
# not evidence that run built it. `results/annb/<pass>/<fingerprint>/` is
# shared across runs by design (see CLAUDE.md): ann-benchmarks skips a
# configuration that already has a result file, so an unchanged tree
# reappears in every later report whose fingerprint matches.
# `report/loaders.py` stamps `source_mtime` into each record for exactly that
# reason, and each artifact's own `build_time` attribute is what actually
# identifies the build behind a cell.
#
# THE INGEST RATE IS MEASURED -- seventeen times across six runs, counting
# distinct `(run_id, dataset, resource_pass, M, build_mode, rows)` tuples over
# every `phase: ingest` record carrying an `ingest_rows_per_s`.
#
# `run_id` IS PART OF THAT KEY AND THE COUNT IS WRONG WITHOUT IT. This file
# used to name the key without it while asserting seventeen, and the key it
# named returns FIFTEEN: dropping `run_id` merges the two fashion-mnist
# normalized 20k runs of 2026-10-15 (383.27 and 384.90 rows/s) and the two
# tuned 20k runs of 2026-10-20/21 (417.64 and 412.99), discarding two real
# figures. Two runs that measure the same configuration are two measurements.
# Fifteen is the number `docs/12-percona-feedback-plan.md` published, and this
# line is the most likely route for it to come back: anyone who re-runs the
# census the way a file describes it gets what that key gives and then
# "fixes" the total. Walk the archive recursively while you are there --
# `ALL_RESULTS/results/` is a superset of `PS/`, and `PS/` additionally holds
# a ZERO-BYTE copy of the one unit file the fashion-mnist entry below is
# derived from, so a PS-only census silently loses it.
#
# Sixteen of the seventeen are `incremental`, from 48.17 rows/s (gist-960,
# tuned, M=32, 1M rows) to 638.11 (sift-128, normalized, M=8, 1M rows); the
# seventeenth is the `post` plain load at 2653.0 rows/s, which is the maximum
# and a different quantity, because no graph is being built during it.
#
# AND IT IS MODELLED NOW. `orchestrator/estimate.py` carries the M=16
# `incremental` mid-grid rate for the three datasets that have one -- 339, 275
# and 427 rows/s on fashion-mnist, glove-100 and sift-128, all from
# `full-20261015-215006` -- plus 275 as this engine's reference rate.
# gist-960 was measured at M=32 alone and is deliberately absent, so the
# formula serves it; the `post` figure is in neither table. `_effective_rate`
# therefore returns a number for every dataset and nothing names this engine
# in `engines_without_ingest_rate` any more. Read the comment above
# `_MEASURED_ROWS_PER_S` for the pass and row-count conventions behind each
# figure, and for the fact that all seventeen records come from the OLD pin.
#
# One thing that did NOT change: `--profile percona` still prints no estimate
# block at all. Its whole worst case is ~0.3 h and `print_load_estimate`
# returns early under 1 h, which it did before this engine had a rate too. The
# hour figure is in the dict the CLI and the web UI read, not on stdout here.
name: percona
description: Percona Server alone — ef_construction sweep and both build modes

engines: [percona]

datasets:
  - fashion-mnist-784-euclidean

k: 10
runs: 1

# Deep-merged onto whichever resource pass is selected
# (`config.merge_resource_overrides`), so this adds an extra without editing a
# shared pass and changing every other profile.
resources:
  extras:
    # THE ef_construction SWEEP ITSELF. Read by `ann_pass.render_config` only
    # under `--resource-pass tuned`, which is the one branch that takes a list
    # — see the note beside `ann.percona_ef_construction`.
    #
    # The server accepts 1..4096 and defaults to 200. These bracket the
    # default by a factor of four either way, which is enough to show whether
    # the knob moves the frontier at all before anyone spends a wider sweep on
    # it. Three values, three full corpus reloads, and the row count here is
    # the ANN pass's: 60,000, not the 20,000 an ops unit loads. `ann_pass`
    # never reads `ops.subset_rows`, so the sweep always gets the whole
    # corpus. The three builds behind the recorded cells cost 130.8 s, 161.6 s
    # and 283.3 s of `build_time` at M=16 -- minutes, which is the whole
    # reason the dataset here is the small one, and a 2.17x spread between
    # the ends of the sweep rather than the 16x the knob ratio suggests.
    #
    # The cells carry MORE `ef_search` points than `ann.ef_search` below sets,
    # and that is not this profile's doing: the ann tree is shared, so a
    # wider grid run from another profile leaves cells here that this
    # profile would never request. Read `ann.ef_search` for what a run from
    # here measures, not the file count.
    percona_ef_construction: [50, 200, 800]

ann:
  enabled: true
  # One M value. The axis under test here is ef_construction, and sweeping M
  # beside it multiplies the reloads without separating the two effects —
  # every M value reloads the whole corpus, which is this repo's dominant
  # cost. M=16 because that is where `main` and `smoke` sit, so a curve from
  # here can be read beside one from there.
  m_values: [16]
  ef_search: [10, 20, 40, 80, 160]

  # THE FIRST AXIS, and the value here is the NORMALIZED pass's pin rather
  # than the sweep. Percona is the only MySQL-family engine in this study with
  # a build-time effort knob as well as a query-time one, and that is the
  # finding this profile exists to turn into a measurement.
  #
  # **The sweep is `resources.extras.percona_ef_construction` below and lands
  # in the TUNED pass**, which is where `ann_pass.render_config` reads a list
  # at all: the normalized branch coerces this key to a single int by
  # construction (`[int(ann.get("percona_ef_construction", 200))]`), exactly
  # as it does for pgvector's and Valkey's. So `--resource-pass normalized`
  # measures the vendor default and `--resource-pass tuned` measures the
  # sweep, and a scalar here with sweep-shaped prose beside it would have
  # claimed a measurement this profile never takes.
  #
  # Not bent for this profile even though the usual fairness argument for
  # pinning — a knob only one engine has must not become a tuning axis the
  # others lack — plainly does not apply to a one-engine run. Bending it
  # would mean a per-profile exception inside `render_config`, and the tuned
  # pass already does the job.
  percona_ef_construction: 200

  batch: false

  # `percona_build_modes` IS NOT SET HERE, AND SETTING IT HERE IS AN ERROR
  # THAT COSTS THIS PROFILE BOTH OF ITS AXES. The second axis lives under
  # `ops:` below; this note is here because `ann:` is where
  # `pgvector_build_modes` sits and is therefore where someone will reach
  # for it.
  #
  # `ann_pass.render_config` is handed the whole profile and POLICES
  # `ann.percona_build_modes`: the ann overlay module reads no `build_mode`,
  # so any value but `["post"]` would render two run groups differing only in
  # a `method_param` nothing reads — two identical recall curves under two
  # labels — and it raises instead. The raise is correct. What it costs if the
  # key is in this block is everything:
  #
  #   * `run --profile percona` fails its ann phase (`cli._run_unit`),
  #   * `render --profile percona` raises UNCAUGHT out of `cmd_render`, which
  #     loops over KNOWN_ENGINES — so a one-engine profile tracebacks,
  #   * and `percona_ef_construction` below, which only `render_config`
  #     reads, is then never swept at all.

ops:
  enabled: true
  # `build` is the workload this profile is for: it is the one that records
  # `ingest_wall_s`, `build_wall_s` and `index_bytes` separately, which is
  # what makes a bulk build comparable to an incremental one. `concurrency`
  # and `filtered` are kept because they are cheap at this corpus size and a
  # build-mode change can move query latency as well as build cost — an index
  # built in one pass over sorted data is not laid out like one grown row by
  # row. `churn` is deliberately out, and the REASON changed even though the
  # decision did not. It used to read "Percona's repair path rebuilds the
  # whole graph (docs/09 §2.7), so a churn phase here would cost on the order
  # of a bulk build per fraction" -- which is no longer the fact: at the
  # pinned `source.tag` that repair is withdrawn
  # (`capabilities.vector_index_replace: false`, which is now its own key and
  # stayed false when `bulk_vector_index_build` was flipped to true) and a
  # churn phase would cost nothing extra for it, because `maintain()` returns
  # without issuing the ALTER. `churn` stays out because this profile exists
  # to compare the two BUILD MODES and churn measures neither axis above --
  # and, at this pin, because the repair whose cost would have made it
  # interesting does not run. If `vector_index_replace` is ever flipped to
  # `true`, the original cost argument becomes live again and is the reason
  # to keep churn out.
  workloads: [build, concurrency, filtered]
  m_values: [16]
  ef_search: 100
  # Small enough that both build modes fit in minutes rather than hours. This
  # profile answers "does the knob/mode matter", not "what is the number on a
  # million rows"; `main` is for the latter.
  subset_rows: 20000
  load_threads: 1
  max_queries: 200
  client_counts: [1, 4]
  concurrency_duration_s: 8
  selectivities: [0.10]

  # THE SECOND AXIS, and the one with a result that reaches beyond this
  # engine. pgvector already runs both build modes, but pgvector is also the
  # only Postgres here — so today "bulk is cheaper than incremental" and
  # "Postgres differs from MySQL here" are the same observation and cannot be
  # separated. A second both-modes curve on a MySQL-family server separates
  # them. That is the value, and it is narrower than "a new capability".
  #
  # **IT LIVES UNDER `ops:` AND `pgvector_build_modes` LIVES UNDER `ann:`,
  # and the difference is load-bearing rather than untidy.** pgvector's list
  # drives both passes, because its overlay module reads `build_mode`; this
  # one drives the ops pass alone, because Percona's does not. Under `ann:`
  # it would be seen by `ann_pass.render_config`, which refuses it — see the
  # note at the end of the `ann:` block for what that costs.
  #
  # Read by `orchestrator/cli.py`'s ops loop and counted by
  # `estimate._ops_units`, both through one `{engine: (block, key)}` mapping
  # that the two files are tested to agree on.
  #
  # So this profile's ann phase runs one curve per `ef_construction` value and
  # its ops phase runs two units per M value, and the build-mode result comes
  # from the ops records — which is where `build_wall_s`, `ingest_wall_s` and
  # `index_bytes` live anyway, so nothing is lost by the ann half's absence
  # except a recall curve per mode.
  #
  # `post` is a real bulk build here and not the no-op it is for MariaDB and
  # AliSQL: `PerconaDriver.create_schema` leaves the vector index out of the
  # table definition in this mode and `create_index` adds it with one
  # `ALTER TABLE … ADD VECTOR KEY … ALGORITHM=INPLACE` afterwards.
  #
  # THAT STATEMENT KILLED THE SERVER AT THE OLD PIN (9.7.1-1), and this list
  # was cut to `[incremental]` for it: the load completed, the ALTER lost the
  # connection, and the same corpus built and served correctly in
  # `incremental`. At the current pin it built 25 times out of 25 and a
  # 60,000-row comparison of the two modes gave the same index quality (the
  # `percona-build-modes` profile), so both values are back. The evidence and
  # the history are recorded once, next to
  # `capabilities.bulk_vector_index_build` in `config/engines/percona.yml`
  # -- not duplicated here, because a second copy is a second thing to go
  # stale.
  #
  # Restoring `post` does NOT restore the churn repair, which is a different
  # ALTER (a replace on an indexed table) and is still withdrawn by
  # `capabilities.vector_index_replace: false` -- see the `workloads` note
  # above for why churn stays out of this profile regardless.
  percona_build_modes: [post, incremental]
