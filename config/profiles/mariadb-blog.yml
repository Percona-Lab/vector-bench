# Reproduces MariaDB's "Big vector search benchmark: 10 databases compared"
# as closely as this framework can.
#   https://mariadb.org/big-vector-search-benchmark-10-databases-comparison/
#
# What that benchmark used, from the article:
#   dataset   dbpedia-openai-1000k — 1M DBpedia texts as 1536-dim OpenAI
#             embeddings, angular distance
#   tool      their fork of ann-benchmarks (this framework is built on it)
#   engines   MariaDB 12.3 and 11.8, pgvector master, plus eight others
#   hardware  Intel Xeon E5-2660 v4 @ 2.00GHz — AVX2, NO AVX-512
#
# Index parameters were not published, so the M and ef_search grids below are
# ann-benchmarks' conventional ranges rather than a claim to match theirs.
#
# WHERE THIS WILL DIFFER FROM THE PUBLISHED RESULTS, unavoidably:
#
#   * Hardware. Their CPU has no AVX-512. If yours does — a Xeon Gold 6230
#     does — MariaDB MHNSW and AliSQL VIDX both take wider SIMD paths and will
#     look faster than published. This is the single largest source of
#     divergence and it cannot be configured away; build with
#     `--march x86-64-v3` to get closer, at the cost of not measuring your own
#     hardware.
#   * Engines. This framework compares MariaDB, AliSQL and pgvector. The
#     article's other seven systems are out of scope here.
#   * Versions. MariaDB 11.8.8 here against their 11.8 and 12.3; pgvector
#     0.8.6 against their master branch of 2026-02-08.
#
# COST. 1M vectors at 1536 dimensions is by far the heaviest thing this
# framework can run: roughly 5x the per-row work of glove-100. Estimated ingest
# is ~1 h for pgvector, ~19 h for MariaDB and ~52 h for AliSQL — about three
# days for all three.
#
# Run all three. AliSQL is 72% of that time, which makes it tempting to drop,
# but MariaDB vs AliSQL is the comparison this project exists to make — the
# article's framing is MariaDB against everything else, which is not the same
# question. Dropping AliSQL to save time removes half the comparison rather
# than trimming it.
#
# If three days is too long, cut the corpus instead: dbpedia-openai-500k-angular
# and -100k-angular are the same embeddings at smaller scale and keep all three
# engines in the picture.
name: mariadb-blog
description: MariaDB big-vector benchmark corpus — dbpedia-openai-1000k, 1536 dims (days)

datasets:
  - dbpedia-openai-1000k-angular

k: 10
runs: 1

# This corpus does not fit the shared 16 GB budget, and the first run proved it
# the expensive way: the table is 7.7 GB and the index 3.9 GB, so pgvector was
# OOM-killed by the cgroup after three hours and AliSQL spent its entire ops
# phase pinned at the ceiling, reclaiming continuously. MariaDB peaked at
# 8.25 GB and was the only engine the budget actually fitted, which made the
# "normalized" pass a measurement of who fits in 16 GB rather than who is
# faster.
#
# 64 GB holds the table, the index and working memory for all three with room
# to spare. Raise it further only if a future corpus needs it; the point of the
# normalized pass is that every engine gets the same budget, not that the
# budget is large.
resources:
  memory:
    server_limit_gb: 64
  cpu:
    # The normalized pass gives the client 4 cores, which is fine when the
    # concurrency grid tops out low. Driving 32 concurrent clients from 4 cores
    # measures the client, not the server, and every engine would report the
    # same ceiling — which is indistinguishable from "they all saturate here".
    #
    # This is not a hypothetical worry about a future run. The existing
    # glove-100 result (MariaDB flat at ~325 QPS from 2 clients through 32) was
    # taken with 4 client cores and 8 server cores, and cannot currently be told
    # apart from the client running out of CPU. 16 client cores keeps the ratio
    # at 2 threads per core at the top of the grid.
    #
    # 8 server + 16 client is 24 of this machine's 40 physical cores. The
    # allocation is identical for every engine, so the comparison stays fair.
    client_cpus: 16

# Normalized only unless asked otherwise. Both passes over a million 1536-dim
# vectors is ~144 h of ingest, and that is not something anyone should end up
# running because a flag defaulted. Override with --resource-pass both.
default_resource_pass: normalized

ann:
  enabled: true
  # One M. At this dimensionality each additional value is another full load of
  # a million 1536-dim vectors; the recall/QPS curve comes from the ef_search
  # sweep, which reuses the built index and is nearly free.
  m_values: [16]
  ef_search: [10, 20, 40, 80, 120, 200, 400, 800]
  pgvector_ef_construction: 200
  pgvector_build_modes: [post]
  batch: false
  # The preview article notes MariaDB tested both InnoDB and MyISAM. InnoDB is
  # the headline here because AliSQL's VIDX is InnoDB-only; add MyISAM via the
  # tuned pass if you want MariaDB's best case.
  mariadb_storage_engines: [InnoDB]

ops:
  enabled: true
  # Build cost is the interesting ops dimension at this scale — it is where the
  # incremental builders diverge most from pgvector's bulk build.
  #
  # Concurrency is on because it is nearly free: the harness loads the corpus
  # once and runs every requested workload against that same table, so
  # concurrency costs only its own query time (six minutes per engine) rather
  # than another 3-7 hour load.
  #
  # Filtered and churn are on too. They are the reason to keep vectors in a
  # database rather than a dedicated store, and like concurrency they run
  # against the corpus that has already been loaded. Filtered adds a brute-force
  # ground-truth pass per selectivity; churn rewrites 10% of a million rows at
  # the engine's incremental insert rate. Together roughly two hours across the
  # three engines, against 21 hours of loading that is being paid anyway.
  workloads: [build, concurrency, filtered, churn]
  m_values: [16]
  ef_search: 100
  subset_rows: null
  load_threads: 1
  max_queries: 500
  # [1, 4, 16] would have missed the most interesting concurrency result we
  # have so far: on glove-100 MariaDB saturated at TWO clients and then stayed
  # flat from 4 through 32 while p99 degraded 15x. A grid that jumps 1 -> 4
  # steps straight over the knee and reports a flat line with no explanation.
  # Each extra point is one more `concurrency_duration_s`, so resolution here
  # is nearly free.
  # Keeps the 2-client point that the measurement profiles dropped on
  # 2026-10-14: here it is a QPS figure compared against a published
  # curve, not a concurrency verdict. The verdict at n=2 is undecidable
  # either way -- see config/profiles/main.yml -- so read this point's
  # throughput and percentiles and ignore its scaling_status.
  client_counts: [1, 2, 4, 8, 16, 32]
  # 30s at these throughputs is a few thousand queries, which is thin for a p99.
  # Six points at 60s is six minutes per engine.
  concurrency_duration_s: 60
  # 1% is the hard case and the one worth having: on glove-100 MariaDB fell to
  # 0.9 QPS there against 326 unfiltered, a 360x penalty that is itself a
  # result. It is slow to measure for the same reason, so budget for it.
  # 5% says where between the two MariaDB falls off; see main.yml.
  selectivities: [0.10, 0.05, 0.01]
  churn_fractions: [0.10]
